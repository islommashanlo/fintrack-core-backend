        ticker:
          type: string
          nullable: true
        cik:
          type: string
          pattern: '^[0-9]{10}$'
          nullable: true
        match_type:
          type: string
          enum: [exact_ticker, exact_cik, exact_name, prefix, substring, fuzzy]
        profile_path:
          type: string
          description: Relative path to the existing JSON company, fund or insider profile.
        accession:
          type: string
          nullable: true
        sec_url:
          type: string
          format: uri
          nullable: true
        form_type:
          type: string
          nullable: true
          enum: ['4', 4/A, 13F-HR, 13F-HR/A, 13F-NT]
        filed_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        accepted_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        ingested_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        data_age_days:
          type: integer
          nullable: true
    SearchGroupMeta:
      type: object
      required: [total_count, has_more, next_cursor, limit, sort, as_of]
