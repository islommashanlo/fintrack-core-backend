              properties:
                companies:
                  "$ref": "#/components/schemas/SearchGroupMeta"
                funds:
                  "$ref": "#/components/schemas/SearchGroupMeta"
                insiders:
                  "$ref": "#/components/schemas/SearchGroupMeta"
            disclaimer:
              type: string
    SearchResults:
      type: array
