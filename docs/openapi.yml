---
openapi: 3.0.3
info:
  title: FilingsIntel JSON API
  version: 1.8.0
  description: Implemented account, watchlist, plan-catalog and filing-data read APIs.
    Cookie mutations require browser-session CSRF tokens. Other planned routes are
    still being built. Data from public SEC filings. Not investment advice.
servers:
- url: "/api/v1"
paths:
  "/insiders/transactions":
    get:
      operationId: listInsiderTransactions
      summary: List reported insider transaction rows
      description: Includes parsed Form 4 and 4/A filings, with amendments resolved
        as of the first page. One row per reporting owner and transaction line, including
        both security tables. Filters combine with AND. Decimals are strings. Missing
        sort values come last; row ID breaks ties in the same direction.
      parameters:
      - "$ref": "#/components/parameters/TransactionType"
      - "$ref": "#/components/parameters/TransactionCode"
      - "$ref": "#/components/parameters/TransactionDirection"
      - "$ref": "#/components/parameters/TransactionRole"
      - "$ref": "#/components/parameters/TransactionInsiderCik"
      - "$ref": "#/components/parameters/TransactionIssuerCik"
      - "$ref": "#/components/parameters/TransactionTicker"
      - "$ref": "#/components/parameters/TransactionSecurityTable"
      - "$ref": "#/components/parameters/TransactionMinValue"
      - "$ref": "#/components/parameters/TransactionMaxValue"
      - "$ref": "#/components/parameters/TransactionDateFrom"
      - "$ref": "#/components/parameters/TransactionDateTo"
      - "$ref": "#/components/parameters/TransactionSort"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Matching reporting-owner rows and cursor metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/InsiderTransaction"
                  meta:
                    "$ref": "#/components/schemas/TransactionPageMeta"
        '400':
          description: Unknown or malformed parameter, invalid range, or invalid cursor.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ParameterError"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/funds":
    get:
      operationId: listFunds
      summary: List institutional filers
      parameters:
      - name: q
        in: query
        description: Literal name substring or exact CIK.
        schema:
          type: string
      - name: sort
        in: query
        description: Missing values last; row ID breaks ties in the same direction.
        schema:
          type: string
          enum:
          - name
          - "-name"
          - cik
          - "-cik"
          default: name
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Locally stored filing data.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/Fund"
                  meta:
                    "$ref": "#/components/schemas/ReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/funds/{cik}":
    get:
      operationId: getFund
      summary: Get fund identity and latest known report
      parameters: []
      responses:
        '200':
          description: Locally stored filing data.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/FundProfile"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
    parameters:
    - "$ref": "#/components/parameters/FundCik"
  "/funds/{cik}/holdings":
    get:
      operationId: listFundHoldings
      summary: List effective reported holdings
      parameters:
      - "$ref": "#/components/parameters/Period"
      - "$ref": "#/components/parameters/Cusip"
      - "$ref": "#/components/parameters/PutCall"
      - "$ref": "#/components/parameters/ShareType"
      - name: sort
        in: query
        description: Missing values last; row ID breaks ties in the same direction.
        schema:
          type: string
          enum:
          - value_usd
          - "-value_usd"
          - shares
          - "-shares"
          - cusip
          - "-cusip"
          - row_sequence
          - "-row_sequence"
          default: "-value_usd"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Locally stored filing data.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/InstitutionalHolding"
                  meta:
                    "$ref": "#/components/schemas/ReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
      description: One row per information-table line. RESTATEMENT replaces the base;
        later NEW HOLDINGS adds. Notices and unresolved additions have no effective
        holdings. Original reported units and values remain separate from normalized
        values.
    parameters:
    - "$ref": "#/components/parameters/FundCik"
  "/funds/{cik}/history":
    get:
      operationId: listFundReports
      summary: List report history including amendments and notices
      parameters:
      - "$ref": "#/components/parameters/Period"
      - name: sort
        in: query
        description: Missing values last; row ID breaks ties in the same direction.
        schema:
          type: string
          enum:
          - period
          - "-period"
          - filed_at
          - "-filed_at"
          default: "-period"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Locally stored filing data.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/InstitutionalReport"
                  meta:
                    "$ref": "#/components/schemas/ReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
    parameters:
    - "$ref": "#/components/parameters/FundCik"
  "/funds/{cik}/changes":
    get:
      operationId: listFundChanges
      summary: List changes against the preceding available period
      parameters:
      - "$ref": "#/components/parameters/Period"
      - name: change_type
        in: query
        schema:
          type: string
          enum:
          - new
          - added
          - reduced
          - exited
      - name: sort
        in: query
        description: Missing values last; row ID breaks ties in the same direction.
        schema:
          type: string
          enum:
          - value_change
          - "-value_change"
          - shares_change
          - "-shares_change"
          - cusip
          - "-cusip"
          default: "-value_change"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Locally stored filing data.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/PositionChange"
                  meta:
                    "$ref": "#/components/schemas/ReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
      description: Computed in SQL from effective holdings. Value/share sorts use
        absolute deltas. All contributing current/prior filings are linked; missing
        normalized values remain null. No derived rows are written by this request.
    parameters:
    - "$ref": "#/components/parameters/FundCik"
  "/companies/{ticker}":
    get:
      operationId: getCompany
      summary: Get company identity and 90-day insider summary
      parameters: []
      responses:
        '200':
          description: Locally stored filing data.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/Company"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
      description: Exact case-insensitive ticker. Summary counts first-owner, non-derivative
        P/S rows; suspect or missing prices are excluded from value totals. Existing
        local mappings can supply a name/ticker with null CIK when no Form 4 exists.
    parameters:
    - "$ref": "#/components/parameters/CompanyTicker"
  "/companies/{ticker}/insiders":
    get:
      operationId: listCompanyInsiderTransactions
      summary: List company insider transaction rows
      parameters:
      - "$ref": "#/components/parameters/TransactionType"
      - "$ref": "#/components/parameters/TransactionCode"
      - "$ref": "#/components/parameters/TransactionDirection"
      - "$ref": "#/components/parameters/TransactionRole"
      - "$ref": "#/components/parameters/TransactionInsiderCik"
      - "$ref": "#/components/parameters/TransactionSecurityTable"
      - "$ref": "#/components/parameters/TransactionMinValue"
      - "$ref": "#/components/parameters/TransactionMaxValue"
      - "$ref": "#/components/parameters/TransactionDateFrom"
      - "$ref": "#/components/parameters/TransactionDateTo"
      - "$ref": "#/components/parameters/TransactionSort"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Locally stored filing data.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/InsiderTransaction"
                  meta:
                    "$ref": "#/components/schemas/ReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
    parameters:
    - "$ref": "#/components/parameters/CompanyTicker"
  "/companies/{ticker}/filings":
    get:
      operationId: listCompanyFilings
      summary: List company filing summaries
      parameters:
      - name: form_type
        in: query
        schema:
          type: string
          enum:
          - '4'
          - 4/A
      - name: sort
        in: query
        description: Missing values last; row ID breaks ties in the same direction.
        schema:
          type: string
          enum:
          - filed_at
          - "-filed_at"
          - period
          - "-period"
          default: "-filed_at"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Locally stored filing data.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/FilingSummary"
                  meta:
                    "$ref": "#/components/schemas/ReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
    parameters:
    - "$ref": "#/components/parameters/CompanyTicker"
  "/companies/{ticker}/institutional":
    get:
      operationId: listCompanyInstitutionalHoldings
      summary: List mapped institutional holding rows
      parameters:
      - "$ref": "#/components/parameters/Period"
      - "$ref": "#/components/parameters/Cusip"
      - "$ref": "#/components/parameters/PutCall"
      - "$ref": "#/components/parameters/ShareType"
      - name: sort
        in: query
        description: Missing values last; row ID breaks ties in the same direction.
        schema:
          type: string
          enum:
          - value_usd
          - "-value_usd"
          - shares
          - "-shares"
          - cusip
          - "-cusip"
          - row_sequence
          - "-row_sequence"
          default: "-value_usd"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Locally stored filing data.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/InstitutionalHolding"
                  meta:
                    "$ref": "#/components/schemas/ReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
      description: Only exact ticker matches from existing mappings marked mapped.
        No external lookups. Defaults to each fund's latest known period. Options,
        share classes and repeated CUSIP lines remain distinct; current mappings are
        not historical identity data.
    parameters:
    - "$ref": "#/components/parameters/CompanyTicker"
  "/insiders/{cik}":
    parameters:
    - "$ref": "#/components/parameters/InsiderCik"
    get:
      operationId: getInsider
      summary: Get an insider profile and 30/90/365-day summaries
      description: Identity includes co-owners, administrative-only and derivative-only
        owners and filings without transaction rows. Summaries use effective non-derivative
        rows for this insider and acceptance-time windows; all codes are counted.
        Unusable P/S values increment the missing-value count and make the net total
        null. Stored values are unchanged.
      parameters: []
      responses:
        '200':
          description: Locally stored reported activity.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/InsiderProfile"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/insiders/{cik}/transactions":
    parameters:
    - "$ref": "#/components/parameters/InsiderCik"
    get:
      operationId: listInsiderTransactionsForOwner
      summary: List one insider reporting owner's transactions
      description: The same transaction-list contract, scoped to this exact insider
        CIK, including all owner sequences and both security tables. Filters cannot
        override insider_cik.
      parameters:
      - "$ref": "#/components/parameters/TransactionType"
      - "$ref": "#/components/parameters/TransactionCode"
      - "$ref": "#/components/parameters/TransactionDirection"
      - "$ref": "#/components/parameters/TransactionRole"
      - "$ref": "#/components/parameters/TransactionIssuerCik"
      - "$ref": "#/components/parameters/TransactionTicker"
      - "$ref": "#/components/parameters/TransactionSecurityTable"
      - "$ref": "#/components/parameters/TransactionMinValue"
      - "$ref": "#/components/parameters/TransactionMaxValue"
      - "$ref": "#/components/parameters/TransactionDateFrom"
      - "$ref": "#/components/parameters/TransactionDateTo"
      - "$ref": "#/components/parameters/TransactionSort"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Locally stored reported activity.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/InsiderTransaction"
                  meta:
                    "$ref": "#/components/schemas/ReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/insiders/{cik}/companies":
    parameters:
    - "$ref": "#/components/parameters/InsiderCik"
    get:
      operationId: listInsiderCompanies
      summary: List historically reported company associations
      description: One row per issuer CIK from known parsed Form 4 disclosures, including
        history. Latest disclosure supplies name/ticker/provenance and this owner's
        reported role. Roles are null when no owner transaction rows exist in that
        disclosure; no current employment is inferred. Filters apply after selecting
        the latest disclosure per issuer. Cursors bind owner, filters, sort and snapshot
        IDs.
      parameters:
      - "$ref": "#/components/parameters/TransactionTicker"
      - "$ref": "#/components/parameters/TransactionRole"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - filed_at
          - "-filed_at"
          - name
          - "-name"
          - ticker
          - "-ticker"
          - cik
          - "-cik"
          default: "-filed_at"
      responses:
        '200':
          description: Locally stored reported activity.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/InsiderCompany"
                  meta:
                    "$ref": "#/components/schemas/ReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/auth/csrf":
    get:
      operationId: getCsrfToken
      summary: Get a browser-session CSRF token
      security: []
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/CsrfToken"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
      description: Fetch with credentials included before every new browser session.
        Response is not cached; matching Rails session cookies must round-trip with
        the token.
  "/auth/signup":
    post:
      operationId: signup
      summary: Create an account and sign in
      security:
      - CsrfToken: []
      parameters: []
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/AccountSession"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '422':
          "$ref": "#/components/responses/AccountValidationFailed"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
                  writeOnly: true
              additionalProperties: false
      description: Normalized email; minimum eight-character password. Rotates browser
        session and CSRF state; replace the client token with the returned token.
        All accounts are Free until verified billing entitlements exist.
  "/auth/login":
    post:
      operationId: login
      summary: Sign in with email and password
      security:
      - CsrfToken: []
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/AccountSession"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
              additionalProperties: false
      description: Same INVALID_CREDENTIALS response for an unknown account and wrong
        password. Replaces this browser session and rotates CSRF state. Cookie expires
        after 30 days; server also checks that absolute lifetime.
  "/auth/logout":
    delete:
      operationId: logout
      summary: Revoke this browser session
      security:
      - CookieSession: []
        CsrfToken: []
      parameters: []
      responses:
        '204':
          description: Completed without a response body.
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
  "/me":
    get:
      operationId: getCurrentAccount
      summary: Get the authenticated account
      security:
      - CookieSession: []
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/Account"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
    patch:
      operationId: updateCurrentAccount
      summary: Change email or password after reauthentication
      security:
      - CookieSession: []
        CsrfToken: []
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/AccountSession"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '422':
          "$ref": "#/components/responses/AccountValidationFailed"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
                  writeOnly: true
                current_password:
                  type: string
                  format: password
                  writeOnly: true
              additionalProperties: false
      description: Requires email and/or password plus current_password. Success revokes
        all old sessions and starts a fresh browser session; use the returned CSRF
        token.
    delete:
      operationId: deleteCurrentAccount
      summary: Delete the authenticated account and its private records
      security:
      - CookieSession: []
        CsrfToken: []
      parameters: []
      responses:
        '204':
          description: Completed without a response body.
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              properties:
                current_password:
                  type: string
                  format: password
                  writeOnly: true
              additionalProperties: false
      description: Deletes private follows, linked alert records and sessions. Public
        filings and normalized reported rows are retained.
  "/plans":
    get:
      operationId: listPlans
      summary: List server-defined plan features and limits
      security: []
      parameters: []
      responses:
        '200':
          description: Completed without a response body.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Plan"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
      description: Null limits mean unlimited. This catalog does not create a subscription
        or grant paid entitlements. Watchlist limits are enforced; other gates are
        being built with their features.
  "/watchlist":
    get:
      operationId: listWatchlist
      summary: List only this user's watchlist items
      security:
      - CookieSession: []
      parameters:
      - name: entity_type
        in: query
        schema:
          type: string
          enum:
          - issuer
          - fund
          - person
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - created_at
          - "-created_at"
          - entity_key
          - "-entity_key"
          default: "-created_at"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Completed without a response body.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/WatchlistItem"
                  meta:
                    "$ref": "#/components/schemas/ReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
      description: Normal cursor envelope; signed cursors also bind the authenticated
        user. Membership inserts after the first-page snapshot are excluded; labels
        can refresh from local profile data.
    post:
      operationId: addWatchlistItem
      summary: Add a local profile to the watchlist
      security:
      - CookieSession: []
        CsrfToken: []
      parameters: []
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/WatchlistItem"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '402':
          "$ref": "#/components/responses/ProRequired"
        '404':
          "$ref": "#/components/responses/NotFound"
        '200':
          description: Existing membership; no duplicate was inserted.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/WatchlistItem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - entity_type
              - entity_key
              properties:
                entity_type:
                  type: string
                  enum:
                  - issuer
                  - fund
                  - person
                entity_key:
                  type: string
                  description: Exact ticker for issuer; 10-digit CIK for fund/person.
                    Target must already be stored locally.
              additionalProperties: false
      description: Locks the user row to enforce the 15-item Free limit. Duplicate
        adds return 200 and the existing item, including at the limit. No email alert
        or external lookup is created.
    delete:
      operationId: removeWatchlistItemByBody
      summary: Remove an item using an explicit JSON id
      security:
      - CookieSession: []
        CsrfToken: []
      parameters: []
      responses:
        '204':
          description: Completed without a response body.
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '404':
          "$ref": "#/components/responses/NotFound"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
                  minimum: 1
              additionalProperties: false
      description: Equivalent to DELETE /watchlist/{id}. Removes only the user-owned
        item and its linked private alert records.
  "/watchlist/{id}":
    delete:
      operationId: removeWatchlistItem
      summary: Remove a user-owned watchlist item
      security:
      - CookieSession: []
        CsrfToken: []
      parameters: []
      responses:
        '204':
          description: Completed without a response body.
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '404':
          "$ref": "#/components/responses/NotFound"
      description: An item owned by another user returns 404. Linked private alert
        records are removed; public filings remain stored.
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  "/filings/{accession}":
    parameters:
    - name: accession
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
    get:
      operationId: getFiling
      summary: Get a stored filing by accession, including historical versions
      security: []
      description: Includes provenance, amendment links, transactions and raw normalized
        holdings arrays. Use the fund holdings endpoint to page large information
        tables. No raw archive path is returned.
      responses:
        '200':
          description: Stored filing.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/FilingDetail"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/activity":
    get:
      operationId: listActivity
      summary: List unified reported insider and institutional activity
      security:
      - {}
      - CookieSession: []
      description: SQL feed of effective Form 4 transaction lines and adjacent-quarter
        13F changes. Joint reporting owners share one event. Institutional comparisons
        require the preceding-quarter baseline and preserve options/share types. Only
        existing unambiguous mappings supply tickers. Scores, levels and sectors are
        null until implemented; their filters return no rows. 13dg/144 sources currently
        have no events. Watchlist cursors bind the authenticated user and initial
        membership IDs.
      parameters:
      - name: source
        in: query
        schema:
          type: string
          enum:
          - insider
          - institutional
          - 13dg
          - '144'
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - purchase
          - sale
          - other
          - increase
          - decrease
      - name: type
        in: query
        schema:
          type: string
          enum:
          - all
          - open_market
          - administrative
          default: all
      - name: level
        in: query
        schema:
          type: string
          enum:
          - normal
          - elevated
          - high
          - unusual
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - occurred_at
          - "-occurred_at"
          - value
          - "-value"
          - score
          - "-score"
          default: "-occurred_at"
      - name: min_value
        in: query
        description: Inclusive usable dollar magnitude. Institutional magnitude is
          the absolute normalized delta; raw signed deltas remain in the details.
        schema:
          "$ref": "#/components/schemas/ValueFilter"
      - name: min_score
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 100
      - name: sector
        in: query
        schema:
          type: string
          maxLength: 80
      - name: date_from
        in: query
        description: Inclusive UTC filing-availability date.
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        description: Inclusive UTC filing-availability date.
        schema:
          type: string
          format: date
      - name: watchlist_only
        in: query
        description: True requires a cookie session; matches only that user's follows
          and disables response caching.
        schema:
          type: boolean
          default: false
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Matching events and cursor/capability metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/ActivityEvent"
                  meta:
                    "$ref": "#/components/schemas/ActivityPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/activity/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        maxLength: 8192
    get:
      operationId: getActivityEvent
      summary: Read an event and its source comparison version
      security: []
      description: Insider links retain the original transaction after amendment.
        Signed institutional IDs reconstruct the exact original effective report set,
        even after a newer restatement. Public source data must still be retained
        and parsed; altered or unknown identifiers return JSON 404. Both sources include
        draft point-in-time factor diagnostics and missing-input coverage. Institutional
        diagnostics verify the complete signed adjacent-quarter report contexts. Overall
        scores remain unavailable; this endpoint does not write derived activity rows.
      responses:
        '200':
          description: Event details with factual provenance, draft factor diagnostics
            and explicit input coverage.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/ActivityEvent"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/insiders/clusters":
    get:
      operationId: listInsiderClusters
      summary: List rolling 14-day purchase and sale reporting clusters
      security:
      - {}
      - CookieSession: []
      parameters:
      - name: direction
        in: query
        schema:
          type: string
          enum:
          - all
          - purchase
          - sale
          default: all
      - name: ticker
        in: query
        description: Exact case-insensitive latest reported ticker for the window.
        schema:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,19}$"
      - name: issuer_cik
        in: query
        schema:
          "$ref": "#/components/schemas/Cik"
      - name: min_insiders
        in: query
        schema:
          type: integer
          minimum: 3
          maximum: 1000
          default: 3
      - name: min_value
        in: query
        description: Inclusive complete total value. Incomplete totals do not match.
        schema:
          "$ref": "#/components/schemas/ValueFilter"
      - name: date_from
        in: query
        description: Inclusive UTC window-end date; defaults to 90 dates before the
          requested end/current snapshot. Earlier membership context is retained.
        schema:
          type: string
          format: date
      - name: date_to
        in: query
        description: Inclusive UTC window-end date.
        schema:
          type: string
          format: date
      - name: watchlist_only
        in: query
        description: Requires sign-in; matches only this user's issuer/person follows.
          A co-owner follow can match a canonical member.
        schema:
          type: boolean
          default: false
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - window_end
          - "-window_end"
          - insider_count
          - "-insider_count"
          - transaction_count
          - "-transaction_count"
          - total_value
          - "-total_value"
          default: "-window_end"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      description: At least three distinct first-listed insiders per issuer and direction,
        with only effective non-derivative P/S lines. Joint-owner copies do not inflate
        counts or value. Each distinct eligible acceptance time anchors an exclusive-start/inclusive-end
        window; overlapping qualifying windows remain separate. Totals are null when
        any member lacks a usable value, with the known subtotal retained. SQL read
        projection; no stored cluster rows or background reprocessing. Watchlist cursors
        bind the user and initial follow IDs.
      responses:
        '200':
          description: Cluster windows and cursor metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/InsiderCluster"
                  meta:
                    "$ref": "#/components/schemas/InsiderClusterPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/methodology":
    get:
      operationId: getMethodology
      summary: Read active cluster criteria and the draft score proposal
      security: []
      parameters: []
      description: Cluster criteria are active. Version 1.2-draft publishes implemented
        insider and institutional factor formulas, source coverage, observed-history
        requirements, context mappings and calendar-day staleness. Overall Activity
        Scores remain unavailable while required market inputs are missing and scoring
        is inactive. Missing inputs are not zero-filled or reweighted.
      responses:
        '200':
          description: Public methodology definition from the version-controlled configuration.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/ActivityMethodology"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/screener/run":
    post:
      operationId: runScreener
      summary: Screen companies, funds or insiders using typed filing-derived conditions
      description: Anonymous and signed-in clients must fetch /auth/csrf and send
        X-CSRF-Token with cookies. Applies flat AND conditions through field/operator
        whitelists and Rails value quoting. No SQL expressions, offset/page numbers
        or client entitlements are accepted. Free clients receive only the first three
        matches across all cursor pages, with full total_count and truncated metadata.
        Company/insider activity windows use acceptance time; fund values are normalized
        reported holdings, not AUM. Missing or suspect totals remain null. Scores,
        sectors, market caps and other unavailable metrics are rejected. This read-only
        POST makes no external requests or data writes.
      security:
      - CsrfToken: []
      - CookieSession: []
        CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ScreenerRequest"
      responses:
        '200':
          description: Matching filing-derived entities, provenance and plan-limited
            cursor metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/ScreenerResult"
                  meta:
                    "$ref": "#/components/schemas/ScreenerPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
components:
  schemas:
    Cik:
      type: string
      pattern: "^[0-9]{10}$"
    NullableDecimal:
      type: string
      nullable: true
      description: Exact reported or calculated decimal, encoded as a string.
      example: '253.125'
    NullableTimestamp:
      type: string
      format: date-time
      nullable: true
    ValueFilter:
      type: string
      pattern: "^[0-9]+(\\.[0-9]+)?$"
    TransactionSort:
      type: string
      enum:
      - filed_at
      - "-filed_at"
      - transaction_date
      - "-transaction_date"
      - value
      - "-value"
      default: "-filed_at"
    TransactionPageMeta:
      type: object
      required:
      - total_count
      - has_more
      - next_cursor
      - limit
      - sort
      - as_of
      properties:
        total_count:
          type: integer
          minimum: 0
          description: Matching reporting-owner rows before applying the cursor boundary.
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
        limit:
          type: integer
          minimum: 1
          maximum: 100
        sort:
          "$ref": "#/components/schemas/TransactionSort"
        as_of:
          type: string
          format: date-time
          description: Original first-page time used for filing visibility and data
            age.
    InsiderTransaction:
      type: object
      required:
      - id
      - accession
      - form_type
      - insider_cik
      - insider_name
      - issuer
      - role
      - owner_sequence
      - security_table
      - transaction_sequence
      - security_title
      - transaction_date
      - transaction_code
      - activity_type
      - direction
      - shares
      - price
      - price_suspect
      - price_suspect_reason
      - value
      - shares_owned_following
      - acquired_disposed
      - direct_or_indirect
      - filed_at
      - accepted_at
      - ingested_at
      - period_of_report
      - data_age_days
      - sec_url
      properties:
        id:
          type: integer
          format: int64
        accession:
          type: string
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
        form_type:
          type: string
          enum:
          - '4'
          - 4/A
        insider_cik:
          "$ref": "#/components/schemas/Cik"
        insider_name:
          type: string
          nullable: true
        issuer:
          type: object
          required:
          - cik
          - name
          - ticker
          properties:
            cik:
              "$ref": "#/components/schemas/Cik"
            name:
              type: string
              nullable: true
            ticker:
              type: string
              nullable: true
        role:
          type: object
          required:
          - is_director
          - is_officer
          - is_ten_percent_owner
          - is_other
          - officer_title
          properties:
            is_director:
              type: boolean
            is_officer:
              type: boolean
            is_ten_percent_owner:
              type: boolean
            is_other:
              type: boolean
            officer_title:
              type: string
              nullable: true
        owner_sequence:
          type: integer
        security_table:
          type: string
          enum:
          - non_derivative
          - derivative
        transaction_sequence:
          type: integer
        security_title:
          type: string
          nullable: true
        transaction_date:
          type: string
          format: date
          nullable: true
        transaction_code:
          type: string
          nullable: true
        activity_type:
          type: string
          enum:
          - open_market
          - administrative
        direction:
          type: string
          enum:
          - purchase
          - sale
          - other
        shares:
          "$ref": "#/components/schemas/NullableDecimal"
        price:
          "$ref": "#/components/schemas/NullableDecimal"
        price_suspect:
          type: boolean
        price_suspect_reason:
          type: string
          nullable: true
        value:
          "$ref": "#/components/schemas/NullableDecimal"
        shares_owned_following:
          "$ref": "#/components/schemas/NullableDecimal"
        acquired_disposed:
          type: string
          nullable: true
        direct_or_indirect:
          type: string
          nullable: true
        filed_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        accepted_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        ingested_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        period_of_report:
          type: string
          format: date
          nullable: true
        data_age_days:
          type: integer
          nullable: true
        sec_url:
          type: string
          format: uri
    ParameterError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - INVALID_PARAMETER
            message:
              type: string
    FilingProvenance:
      type: object
      required:
      - accession
      - form_type
      - sec_url
      - filed_at
      - accepted_at
      - ingested_at
      - data_age_days
      properties:
        accession:
          type: string
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
        form_type:
          type: string
        sec_url:
          type: string
          format: uri
        filed_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        accepted_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        ingested_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        data_age_days:
          type: integer
          nullable: true
    Fund:
      type: object
      required:
      - cik
      - name
      properties:
        cik:
          "$ref": "#/components/schemas/Cik"
        name:
          type: string
    InstitutionalReport:
      type: object
      required:
      - accession
      - form_type
      - sec_url
      - filed_at
      - accepted_at
      - ingested_at
      - data_age_days
      - id
      - period_of_report
      - report_type
      - amendment_type
      - amendment_number
      - other_manager_count
      - table_entry_total
      - table_value_total
      - value_unit
      - suspect
      - suspect_reason
      properties:
        accession:
          type: string
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
        form_type:
          type: string
        sec_url:
          type: string
          format: uri
        filed_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        accepted_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        ingested_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        data_age_days:
          type: integer
          nullable: true
        id:
          type: integer
        period_of_report:
          type: string
          format: date
        report_type:
          type: string
        amendment_type:
          type: string
          nullable: true
        amendment_number:
          type: integer
          nullable: true
        other_manager_count:
          type: integer
          nullable: true
        table_entry_total:
          type: integer
          nullable: true
        table_value_total:
          "$ref": "#/components/schemas/NullableDecimal"
        value_unit:
          type: string
          nullable: true
        suspect:
          type: boolean
