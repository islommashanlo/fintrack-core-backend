                    "$ref": "#/components/schemas/NotificationPreferences"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '422':
          "$ref": "#/components/responses/AccountValidationFailed"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/email/unsubscribe/{token}":
    servers:
    - url: "/"
    parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string
        maxLength: 8192
    get:
      operationId: showEmailUnsubscribe
      summary: Show unsubscribe confirmation without changing consent
      security: []
      responses:
        '200':
          description: HTML confirmation form.
        '404':
          description: Invalid or expired signed token.
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
    post:
      operationId: unsubscribeEmail
      summary: Disable email through a signed one-click URL
      security: []
      description: No login/cookies/CSRF token required; the purpose-specific signed
        URL is the authority. Requires List-Unsubscribe=One-Click, returns directly
        without redirect, and is idempotent while disabled. Tokens expire after one
        year and are invalidated by re-opt-in/address changes. Production provider
        DKIM must cover both unsubscribe headers.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - List-Unsubscribe
              properties:
                List-Unsubscribe:
                  type: string
                  enum:
                  - One-Click
          multipart/form-data:
            schema:
              type: object
              required:
              - List-Unsubscribe
              properties:
                List-Unsubscribe:
                  type: string
                  enum:
                  - One-Click
      responses:
        '200':
          description: Email disabled.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - email_enabled
                    properties:
                      email_enabled:
                        type: boolean
                        enum:
                        - false
        '404':
          description: Invalid, expired or superseded token.
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
components:
  schemas:
    PushChannelEligibility:
      type: object
      required:
      - consent_enabled
      - current_session_device
      - plan_eligible
      - delivery_enabled
      - eligible
      - blockers
      properties:
        consent_enabled:
          type: boolean
        current_session_device:
          type: boolean
        plan_eligible:
          type: boolean
        delivery_enabled:
          type: boolean
          enum:
          - false
        eligible:
          type: boolean
          enum:
          - false
        blockers:
          type: array
          items:
            type: string
            enum:
            - consent_required
            - device_required
            - pro_required
            - delivery_disabled
    PushSubscription:
      type: object
      required:
      - id
      - endpoint_origin
      - active
      - current_session
      - expires_at
      - consented_at
      - created_at
      - updated_at
      properties:
        id:
          type: integer
        endpoint_origin:
          type: string
          format: uri
        active:
          type: boolean
        current_session:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        consented_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PushCapabilities:
      type: object
      required:
      - registration_enabled
      - delivery_enabled
      - maximum_subscriptions
      properties:
        registration_enabled:
          type: boolean
          enum:
          - true
        delivery_enabled:
          type: boolean
          enum:
          - false
        maximum_subscriptions:
          type: integer
          enum:
          - 20
    PushSubscriptionInput:
      type: object
      additionalProperties: false
      required:
      - consent
      - subscription
      properties:
        consent:
          type: boolean
          enum:
          - true
        subscription:
          type: object
          additionalProperties: false
          required:
          - endpoint
          - keys
          properties:
            endpoint:
              type: string
              format: uri
              maxLength: 2048
            expirationTime:
              type: integer
              nullable: true
              minimum: 1
              maximum: 253402300799999
            keys:
              type: object
              additionalProperties: false
              required:
              - p256dh
              - auth
              properties:
                p256dh:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{87}$"
                auth:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{22}$"
    FundComparisonResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [funds, overlaps, positions]
          properties:
            funds:
              type: array
              minItems: 2
              maxItems: 10
              items:
                "$ref": "#/components/schemas/ComparisonFund"
            overlaps:
              type: array
              minItems: 1
              maxItems: 45
              items:
                "$ref": "#/components/schemas/ComparisonOverlap"
            positions:
              type: array
              maxItems: 100
              items:
                "$ref": "#/components/schemas/ComparisonPosition"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ReadPageMeta"
          - type: object
            required: [period_of_report, prior_period_of_report, period_selection, available, unavailable_reason, complete, prior_complete, security_key, disclaimer]
            properties:
              period_of_report:
                type: string
                format: date
                nullable: true
              prior_period_of_report:
                type: string
                format: date
                nullable: true
              period_selection:
                type: string
                enum: [explicit, latest_common]
              available:
                type: boolean
              unavailable_reason:
                type: string
                nullable: true
                enum: [no_common_period, no_current_reports]
              complete:
                type: boolean
                description: Every selected current portfolio has comparable report/key coverage.
              prior_complete:
                type: boolean
              security_key:
                type: array
                items:
                  type: string
                  enum: [cusip, put_call, share_type]
              disclaimer:
                type: string
    ComparisonProvenance:
      type: object
      required: [accession, form_type, sec_url, filed_at, accepted_at, ingested_at, data_age_days]
      properties:
        accession:
          type: string
          nullable: true
        form_type:
          type: string
          nullable: true
        sec_url:
          type: string
          format: uri
          nullable: true
        filed_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        accepted_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        ingested_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        data_age_days:
          type: integer
          nullable: true
    ComparisonSources:
      type: array
      items:
        "$ref": "#/components/schemas/FilingProvenance"
    ComparisonFund:
      allOf:
      - "$ref": "#/components/schemas/ComparisonProvenance"
      - type: object
        required: [cik, name, current_available, prior_available, current_report_present, prior_report_present, current_report_suspect, prior_report_suspect, position_count, excluded_current_rows, excluded_prior_rows, current_sources, prior_sources]
        properties:
          cik:
            "$ref": "#/components/schemas/Cik"
          name:
            type: string
          current_available:
            type: boolean
          prior_available:
            type: boolean
          current_report_present:
            type: boolean
          prior_report_present:
            type: boolean
          current_report_suspect:
            type: boolean
          prior_report_suspect:
            type: boolean
          position_count:
            type: integer
            nullable: true
          excluded_current_rows:
            type: integer
            minimum: 0
          excluded_prior_rows:
            type: integer
            minimum: 0
          current_sources:
            "$ref": "#/components/schemas/ComparisonSources"
          prior_sources:
            "$ref": "#/components/schemas/ComparisonSources"
    ComparisonOverlap:
      allOf:
      - "$ref": "#/components/schemas/ComparisonProvenance"
      - type: object
        required: [left_cik, right_cik, complete, shared_position_count, union_position_count, overlap_percent, differing_move_count, sources]
        properties:
          left_cik:
            "$ref": "#/components/schemas/Cik"
          right_cik:
            "$ref": "#/components/schemas/Cik"
          complete:
            type: boolean
          shared_position_count:
            type: integer
            nullable: true
          union_position_count:
            type: integer
            nullable: true
          overlap_percent:
            "$ref": "#/components/schemas/NullableDecimal"
          differing_move_count:
            type: integer
            nullable: true
          sources:
            "$ref": "#/components/schemas/ComparisonSources"
    ComparisonPosition:
      allOf:
      - "$ref": "#/components/schemas/ComparisonProvenance"
      - type: object
        required: [cusip, put_call, share_type, issuer_name, holder_count, shared_by_all, differing_moves, funds]
        properties:
          cusip:
            type: string
          put_call:
            type: string
            nullable: true
            enum: [PUT, CALL]
          share_type:
            type: string
            enum: [SH, PRN]
          issuer_name:
            type: string
          holder_count:
            type: integer
            minimum: 0
            maximum: 10
          shared_by_all:
            type: boolean
            nullable: true
          differing_moves:
            type: boolean
            nullable: true
          funds:
            type: array
            minItems: 2
            maxItems: 10
            items:
              "$ref": "#/components/schemas/ComparisonEntry"
    ComparisonEntry:
      allOf:
      - "$ref": "#/components/schemas/ComparisonProvenance"
      - type: object
        required: [cik, present, shares, value_usd, prior_shares, prior_value_usd, shares_delta, value_usd_delta, change_type, suspect, prior_suspect, row_count, current_available, prior_available, current_sources, prior_sources]
        properties:
          cik:
            "$ref": "#/components/schemas/Cik"
          present:
            type: boolean
            nullable: true
          shares:
            "$ref": "#/components/schemas/NullableDecimal"
          value_usd:
            "$ref": "#/components/schemas/NullableDecimal"
          prior_shares:
            "$ref": "#/components/schemas/NullableDecimal"
          prior_value_usd:
            "$ref": "#/components/schemas/NullableDecimal"
          shares_delta:
            "$ref": "#/components/schemas/NullableDecimal"
          value_usd_delta:
            "$ref": "#/components/schemas/NullableDecimal"
          change_type:
            type: string
            enum: [new, added, reduced, exited, unchanged, not_reported, unknown]
          suspect:
            type: boolean
          prior_suspect:
            type: boolean
          row_count:
            type: integer
            minimum: 0
          current_available:
            type: boolean
          prior_available:
            type: boolean
          current_sources:
            "$ref": "#/components/schemas/ComparisonSources"
          prior_sources:
            "$ref": "#/components/schemas/ComparisonSources"
    SearchResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          minProperties: 1
          maxProperties: 3
          additionalProperties: false
          properties:
            companies:
              "$ref": "#/components/schemas/SearchResults"
            funds:
              "$ref": "#/components/schemas/SearchResults"
