  "/billing/checkout":
    post:
      operationId: createBillingCheckout
      summary: Create or resume the authenticated account's hosted subscription checkout
      description: No-store. Strict inputs; approved server-side interval price and
        fixed callbacks only. Commits a durable attempt before provider effects.
        Concurrent requests and new UUIDs resume unfinished work. Retry transport
        failures with the same UUID and inputs. Known sessions are retrieved;
        uncertain creation older than 22 hours requires review. Completion never
        grants access; read private subscription status after returning. Shares
        a limit of ten attempts/minute/user with portal creation.
      security:
      - CookieSession: []
        CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - interval
              - request_id
              properties:
                interval:
                  type: string
                  enum: [month, year]
                request_id:
                  "$ref": "#/components/schemas/BillingRequestId"
      responses:
        '200':
          description: Hosted checkout URL for the existing or newly created attempt.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url, request_id, expires_at]
                    properties:
                      url:
                        type: string
                        format: uri
                        description: HTTPS URL on checkout.stripe.com.
                      request_id:
                        "$ref": "#/components/schemas/BillingRequestId"
                      expires_at:
                        type: string
                        format: date-time
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '409':
          "$ref": "#/components/responses/BillingConflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '502':
          "$ref": "#/components/responses/BillingProviderError"
        '503':
          "$ref": "#/components/responses/BillingUnavailable"
  "/billing/portal":
    post:
      operationId: createBillingPortal
      summary: Create a hosted portal session for the authenticated account's customer
      description: No-store. Uses the owned current-mode customer and fixed return
        URL only. Never accepts customer IDs or changes entitlements. UUID scopes
        the provider idempotency key. Shares checkout's ten attempts/minute/user.
      security:
      - CookieSession: []
        CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id]
              properties:
                request_id:
                  "$ref": "#/components/schemas/BillingRequestId"
      responses:
        '200':
          description: Short-lived hosted portal URL; navigate to the returned URL.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url]
                    properties:
                      url:
                        type: string
                        format: uri
                        description: HTTPS URL on billing.stripe.com.
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '409':
          "$ref": "#/components/responses/BillingConflict"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '502':
          "$ref": "#/components/responses/BillingProviderError"
        '503':
          "$ref": "#/components/responses/BillingUnavailable"
  "/billing/subscription":
    get:
      operationId: getBillingSubscription
      summary: Read the authenticated account's verified billing status
      description: No-store. Prefers an eligible subscription, otherwise the latest
        local row for the configured mode. Omits provider IDs, keys and receipts.
        Missing configuration or eligibility uses Free access; no subscription is
        created. Unknown parameters are rejected.
      security:
      - CookieSession: []
      responses:
        '200':
          description: Current account plan and nullable subscription summary.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - plan
                    - subscription
                    properties:
                      plan:
                        type: string
                        enum:
                        - free
                        - pro
                      subscription:
                        "$ref": "#/components/schemas/BillingSubscription"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/webhooks/stripe":
    post:
      operationId: receiveStripeWebhook
      summary: Verify and record a Stripe snapshot event for background refresh
      description: Verifies exact raw bytes, a valid v1 HMAC and a signing timestamp
        within five minutes. No browser session or CSRF required here. Requires
        configured mode/secrets/prices; production accepts live only. Uses own-account
        snapshot version 2026-10-28.endive and subscription created/updated/deleted/
        paused/resumed events. Other signed types are ignored. Jobs refresh current
        provider state without ordering by timestamps. Limit 1 MiB and a separate
        300 deliveries/minute/IP. No-store; HTTP 200 confirms receipt, not payment.
      security:
      - StripeSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - id
              - object
              - api_version
              - type
              - created
              - livemode
              properties:
                id:
                  type: string
                  pattern: "^evt_[A-Za-z0-9_]{1,200}$"
                object:
                  type: string
                  enum:
                  - event
                api_version:
                  type: string
                  enum:
                  - 2026-10-28.endive
                type:
                  type: string
                created:
                  type: integer
                livemode:
                  type: boolean
                data:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Receipt committed and any pending work enqueued.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - received
                    - duplicate
                    properties:
                      received:
                        type: boolean
                        enum:
                        - true
                      duplicate:
                        type: boolean
        '400':
          description: Invalid signature, body, version, mode or account context.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountError"
        '409':
          description: Conflicting immutable identity for an existing event ID.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountError"
        '413':
          description: Payload exceeds 1 MiB.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountError"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/plans":
    get:
      operationId: listPlans
