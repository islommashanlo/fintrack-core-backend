              type: string
              enum:
              - NOT_FOUND
            message:
              type: string
  parameters:
    TransactionType:
      name: type
      in: query
      schema:
        type: string
        enum:
        - all
        - open_market
        - administrative
        default: all
    TransactionCode:
      name: code
      in: query
      description: One SEC code or comma-separated codes; case-insensitive.
      schema:
        type: string
        pattern: "^[A-Za-z](,[A-Za-z])*$"
      example: P,S
    TransactionDirection:
      name: direction
      in: query
      schema:
        type: string
        enum:
        - purchase
        - sale
        - other
    TransactionRole:
      name: role
      in: query
      schema:
        type: string
        enum:
        - director
        - officer
        - ten_percent_owner
        - other
    TransactionInsiderCik:
      name: insider_cik
      in: query
      schema:
        "$ref": "#/components/schemas/Cik"
    TransactionIssuerCik:
      name: issuer_cik
      in: query
      schema:
        "$ref": "#/components/schemas/Cik"
    TransactionTicker:
      name: ticker
      in: query
      description: Exact case-insensitive ticker, including share-class punctuation.
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,19}$"
    TransactionSecurityTable:
      name: security_table
      in: query
      schema:
        type: string
        enum:
        - non_derivative
        - derivative
    TransactionMinValue:
      name: min_value
      in: query
      description: Inclusive minimum reported transaction value in dollars.
      schema:
        "$ref": "#/components/schemas/ValueFilter"
    TransactionMaxValue:
      name: max_value
      in: query
      description: Inclusive maximum reported transaction value in dollars.
      schema:
        "$ref": "#/components/schemas/ValueFilter"
    TransactionDateFrom:
      name: date_from
      in: query
      description: Inclusive transaction date, not filing date.
      schema:
        type: string
        format: date
    TransactionDateTo:
      name: date_to
      in: query
      description: Inclusive transaction date, not filing date.
      schema:
        type: string
        format: date
    TransactionSort:
      name: sort
      in: query
      schema:
        "$ref": "#/components/schemas/TransactionSort"
    TransactionLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    TransactionCursor:
      name: cursor
      in: query
      description: Signed next_cursor from a preceding page; expires in 24 hours.
        Repeat the same normalized filters and sort. Limit may change. Later inserts
        are excluded; updates to existing rows remain visible.
      schema:
        type: string
        maxLength: 8192
    FundCik:
      name: cik
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Cik"
    CompanyTicker:
      name: ticker
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,19}$"
    Period:
      name: period
      in: query
      description: Quarter-end date in YYYY-MM-DD form. Defaults to the latest known
        period where applicable.
      schema:
        type: string
        format: date
    Cusip:
      name: cusip
      in: query
      schema:
        type: string
        pattern: "^[0-9A-Z]{9}$"
    PutCall:
      name: put_call
      in: query
      schema:
        type: string
        enum:
        - PUT
        - CALL
    ShareType:
      name: share_type
      in: query
      schema:
        type: string
        enum:
        - SH
        - PRN
  responses:
    InvalidParameter:
      description: Unknown or malformed parameter, invalid range, invalid or expired
        cursor.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ParameterError"
    NotFound:
      description: Unknown entity in locally stored data.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/NotFoundError"
