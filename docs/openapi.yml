---
openapi: 3.0.3
info:
  title: FilingsIntel JSON API
  version: 1.31.0
  description: Implemented account, watchlist, notification, plan-catalog and filing-data APIs.
    Cookie mutations require browser-session CSRF tokens. Other planned routes are
    still being built. Data from public SEC filings. Not investment advice.
servers:
- url: "/api/v1"
paths:
  "/push-subscriptions":
    get:
      operationId: listPushSubscriptions
      summary: List private device metadata; delivery is disabled
      security:
      - CookieSession: []
      parameters:
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - created_at
          - "-created_at"
          default: "-created_at"
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '400': &1
          "$ref": "#/components/responses/InvalidParameter"
        '401': &2
          "$ref": "#/components/responses/AccountUnauthorized"
        '429': &3
          "$ref": "#/components/responses/RateLimited"
        '503': &4
          "$ref": "#/components/responses/LimiterUnavailable"
        '200':
          description: Private session-bound snapshot page
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      "$ref": "#/components/schemas/PushSubscription"
                  meta:
                    allOf:
                    - "$ref": "#/components/schemas/ReadPageMeta"
                    - "$ref": "#/components/schemas/PushCapabilities"
    post:
      operationId: registerPushSubscription
      summary: Register or refresh a consented device without sending push
      security:
      - CookieSession: []
        CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PushSubscriptionInput"
      responses:
        '400': *1
        '401': *2
        '429': *3
        '503':
          description: 'Limiter unavailable or PUSH_SUBSCRIPTION_UNAVAILABLE: revoke
            and register again'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountError"
        '200':
          description: Existing registration
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    "$ref": "#/components/schemas/PushSubscription"
                  meta:
                    "$ref": "#/components/schemas/PushCapabilities"
        '201':
          description: New registration
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    "$ref": "#/components/schemas/PushSubscription"
                  meta:
                    "$ref": "#/components/schemas/PushCapabilities"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '409':
          description: 'PUSH_SUBSCRIPTION_CONFLICT: endpoint unavailable'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountError"
        '422':
          description: 'PUSH_SUBSCRIPTION_LIMIT: 20 retained records; error.limit is
            20'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountError"
  "/push-subscriptions/{id}":
    delete:
      operationId: revokePushSubscription
      summary: Erase an owned local device registration
      security:
      - CookieSession: []
        CsrfToken: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: "^[1-9][0-9]{0,17}$"
      responses:
        '400': *1
        '401': *2
        '429': *3
        '503': *4
        '204':
          description: Removed locally; browser unsubscribe is separate
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '404':
          "$ref": "#/components/responses/NotFound"
  "/funds/compare":
    get:
      operationId: compareFunds
      summary: Compare local effective 13F portfolios for one quarter
      description: No-store. Public Free requests allow two funds and four completed
        calendar quarters; verified Pro allows up to ten funds per request and full
        history. Defaults to the latest common quarter and pins it in the cursor.
        Uses CUSIP/put-call/share-type keys, SQL overlap and adjacent-quarter changes.
        Missing/suspect coverage is unknown, never an empty book. Source lists
        retain amendment and absence evidence. No provider requests, writes or jobs.
        Position filters do not filter fund summaries or pairwise overlaps.
      security: []
      parameters:
      - name: ciks
        in: query
        required: true
        description: Comma-separated 10-digit CIKs; 2–10 distinct funds. Duplicates collapse; ordering is canonicalized. Free cap is two.
        schema:
          type: string
          maxLength: 200
      - "$ref": "#/components/parameters/Period"
      - name: scope
        in: query
        schema:
          type: string
          enum: [all, shared, differing_moves]
          default: all
      - "$ref": "#/components/parameters/Cusip"
      - "$ref": "#/components/parameters/PutCall"
      - "$ref": "#/components/parameters/ShareType"
      - name: sort
        in: query
        schema:
          type: string
          enum: [holders, '-holders', cusip, '-cusip']
          default: '-holders'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 8192
        description: Signed continuation bound to fund set, filters, actor and plan; expires after 24 hours.
      responses:
        '200':
          description: Complete or explicitly partial comparison with source evidence.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FundComparisonResponse"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '402':
          "$ref": "#/components/responses/ProRequired"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/search":
    get:
      operationId: searchEntities
      summary: Search local companies, funds and insiders in ranked groups
      description: Public local-data search; no account/watchlist data, provider
        requests, writes or jobs. Exact ticker, exact CIK and exact name matches
        precede prefixes, substrings and fuzzy names. Fixed trigram threshold 0.3;
        fuzzy names require at least three characters. Canonical profiles are
        resolved before final matching. Missing filing evidence remains null.
        Groups share initial ingestion ID ceilings. Cursors bind query/group and
        expire after 24 hours; existing-row updates can still affect continuations.
      security: []
      parameters:
      - name: q
        in: query
        required: true
        description: Whitespace-normalized UTF-8 input; at most 400 original bytes, no control characters. LIKE metacharacters are literal.
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: type
        in: query
        schema:
          type: string
          enum: [all, companies, funds, insiders]
          default: all
      - name: sort
        in: query
        schema:
          type: string
          enum: [relevance]
          default: relevance
      - name: limit
        in: query
        description: Maximum results per requested group.
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
      - name: cursor
        in: query
        description: A group's next_cursor; type must select that one group and q must be repeated.
        schema:
          type: string
          maxLength: 8192
      responses:
        '200':
          description: Requested result groups with per-group counts and cursors.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SearchResponse"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/exports/insider-transactions":
    get:
      operationId: exportInsiderTransactions
      summary: Download Pro CSV of filtered reported insider transactions
      description: Private, no-store CSV attachment. Reuses effective Form 4 reads,
        including multiple owners, derivative rows and suspect reported values.
        Exact decimals and source provenance; text formula prefixes are escaped.
        Up to 1000 rows and 10 MiB per file. Signed cursors bind account and export
        context; JSON cursors are incompatible. No provider requests or writes.
        Ten export requests per account and thirty per IP per minute.
      security:
      - CookieSession: []
      parameters:
      - "$ref": "#/components/parameters/TransactionType"
      - "$ref": "#/components/parameters/TransactionCode"
      - "$ref": "#/components/parameters/TransactionDirection"
      - "$ref": "#/components/parameters/TransactionRole"
      - "$ref": "#/components/parameters/TransactionInsiderCik"
      - "$ref": "#/components/parameters/TransactionIssuerCik"
      - "$ref": "#/components/parameters/TransactionTicker"
      - "$ref": "#/components/parameters/TransactionSecurityTable"
      - "$ref": "#/components/parameters/TransactionMinValue"
      - "$ref": "#/components/parameters/TransactionMaxValue"
      - "$ref": "#/components/parameters/TransactionDateFrom"
      - "$ref": "#/components/parameters/TransactionDateTo"
      - "$ref": "#/components/parameters/TransactionSort"
      - "$ref": "#/components/parameters/ExportLimit"
      - "$ref": "#/components/parameters/ExportCursor"
      responses:
        '200':
          "$ref": "#/components/responses/CsvExport"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '402':
          "$ref": "#/components/responses/ProRequired"
        '422':
          "$ref": "#/components/responses/ExportTooLarge"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/exports/fund-holdings":
    get:
      operationId: exportFundHoldings
      summary: Download Pro CSV of effective reported 13F holding rows
      description: Private, no-store. Uses original units, normalized values,
        suspect flags and separate repeated/option rows. Latest default period is
        pinned; older periods allowed for verified Pro. Source provenance and
        spreadsheet-safe text. Up to 1000 rows and 10 MiB per file, with signed
        account-bound cursors. No external requests, enrichment, writes or jobs.
      security:
      - CookieSession: []
      parameters:
      - "$ref": "#/components/parameters/ExportFundCik"
      - "$ref": "#/components/parameters/Period"
      - "$ref": "#/components/parameters/Cusip"
      - "$ref": "#/components/parameters/PutCall"
      - "$ref": "#/components/parameters/ShareType"
      - name: sort
        in: query
        schema:
          type: string
          enum: [value_usd, "-value_usd", shares, "-shares", cusip, "-cusip", row_sequence, "-row_sequence"]
          default: "-value_usd"
      - "$ref": "#/components/parameters/ExportLimit"
      - "$ref": "#/components/parameters/ExportCursor"
      responses:
        '200':
          "$ref": "#/components/responses/CsvExport"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '402':
          "$ref": "#/components/responses/ProRequired"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ExportTooLarge"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/exports/fund-changes":
    get:
      operationId: exportFundChanges
      summary: Download Pro CSV of derived fund position changes
      description: Private, no-store. Reuses the preceding available period and
        existing amendment/quality logic. Includes fund identity, exact deltas and
        full current/prior source arrays as JSON cells, including older baselines.
        Default period pinned. Up to 1000 rows and 10 MiB per file, with signed
        account-bound cursors. No provider requests, writes or jobs.
      security:
      - CookieSession: []
      parameters:
      - "$ref": "#/components/parameters/ExportFundCik"
      - "$ref": "#/components/parameters/Period"
      - name: change_type
        in: query
        schema:
          type: string
          enum: [new, added, reduced, exited]
      - name: sort
        in: query
        schema:
          type: string
          enum: [value_change, "-value_change", shares_change, "-shares_change", cusip, "-cusip"]
          default: "-value_change"
      - "$ref": "#/components/parameters/ExportLimit"
      - "$ref": "#/components/parameters/ExportCursor"
      responses:
        '200':
          "$ref": "#/components/responses/CsvExport"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '402':
          "$ref": "#/components/responses/ProRequired"
        '404':
          "$ref": "#/components/responses/NotFound"
        '422':
          "$ref": "#/components/responses/ExportTooLarge"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/dashboard":
    get:
      operationId: getDashboard
      summary: Read the authenticated account's local-data dashboard
      description: No-store. Counts parsed local source records, ranks cluster
        windows by distinct-insider count, and lists only this account's watchlist
        activity. Uses shared ingestion ID ceilings and a UTC calendar window ending
        at as_of. Sections expose filters and cursors reusable with activity/cluster
        endpoints. Scores and price movers are explicitly unavailable. No provider
        requests, writes or jobs. Unknown parameters are rejected.
      security:
      - CookieSession: []
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          enum: [7, 30, 90]
          default: 30
      - name: limit
        in: query
        description: Maximum rows per activity/cluster section; unusual preview also honors the plan cap.
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
      responses:
        '200':
          description: Private aggregate response from locally stored filings.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DashboardResponse"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/insiders/transactions":
    get:
      operationId: listInsiderTransactions
      summary: List reported insider transaction rows
      description: Includes parsed Form 4 and 4/A filings, with amendments resolved
        as of the first page. One row per reporting owner and transaction line, including
        both security tables. Filters combine with AND. Decimals are strings. Missing
        sort values come last; row ID breaks ties in the same direction.
      parameters:
      - "$ref": "#/components/parameters/TransactionType"
      - "$ref": "#/components/parameters/TransactionCode"
      - "$ref": "#/components/parameters/TransactionDirection"
      - "$ref": "#/components/parameters/TransactionRole"
      - "$ref": "#/components/parameters/TransactionInsiderCik"
      - "$ref": "#/components/parameters/TransactionIssuerCik"
      - "$ref": "#/components/parameters/TransactionTicker"
      - "$ref": "#/components/parameters/TransactionSecurityTable"
      - "$ref": "#/components/parameters/TransactionMinValue"
      - "$ref": "#/components/parameters/TransactionMaxValue"
      - "$ref": "#/components/parameters/TransactionDateFrom"
      - "$ref": "#/components/parameters/TransactionDateTo"
      - "$ref": "#/components/parameters/TransactionSort"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Matching reporting-owner rows and cursor metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/InsiderTransaction"
                  meta:
                    "$ref": "#/components/schemas/TransactionPageMeta"
        '400':
          description: Unknown or malformed parameter, invalid range, or invalid cursor.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ParameterError"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/funds":
    get:
      operationId: listFunds
      summary: List institutional filers
      parameters:
      - name: q
        in: query
        description: Literal name substring or exact CIK.
        schema:
          type: string
      - name: sort
        in: query
        description: Missing values last; row ID breaks ties in the same direction.
        schema:
          type: string
          enum:
          - name
          - "-name"
          - cik
          - "-cik"
          default: name
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Locally stored filing data.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/Fund"
                  meta:
                    "$ref": "#/components/schemas/ReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/funds/{cik}":
    get:
      operationId: getFund
      summary: Get fund identity and latest known report
      parameters: []
      responses:
        '200':
          description: Locally stored filing data.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/FundProfile"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
    parameters:
    - "$ref": "#/components/parameters/FundCik"
  "/funds/{cik}/holdings":
    get:
      operationId: listFundHoldings
      summary: List effective reported holdings
      parameters:
      - "$ref": "#/components/parameters/Period"
      - "$ref": "#/components/parameters/Cusip"
      - "$ref": "#/components/parameters/PutCall"
      - "$ref": "#/components/parameters/ShareType"
      - name: sort
        in: query
        description: Missing values last; row ID breaks ties in the same direction.
        schema:
          type: string
          enum:
          - value_usd
          - "-value_usd"
          - shares
          - "-shares"
          - cusip
          - "-cusip"
          - row_sequence
          - "-row_sequence"
          default: "-value_usd"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: No-store quarterly data with plan-aware history metadata. Free has four completed quarters; older selected periods require Pro. Restart cursors after account or plan changes.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/InstitutionalHolding"
                  meta:
                    "$ref": "#/components/schemas/HistoryReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '402':
          "$ref": "#/components/responses/ProRequired"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
      description: One row per information-table line. RESTATEMENT replaces the base;
        later NEW HOLDINGS adds. Notices and unresolved additions have no effective
        holdings. Original reported units and values remain separate from normalized
        values.
    parameters:
    - "$ref": "#/components/parameters/FundCik"
  "/funds/{cik}/history":
    get:
      operationId: listFundReports
      summary: List report history including amendments and notices
      parameters:
      - "$ref": "#/components/parameters/Period"
      - name: sort
        in: query
        description: Missing values last; row ID breaks ties in the same direction.
        schema:
          type: string
          enum:
          - period
          - "-period"
          - filed_at
          - "-filed_at"
          default: "-period"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: No-store quarterly data with plan-aware history metadata. Free has four completed quarters; older selected periods require Pro. Restart cursors after account or plan changes.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/InstitutionalReport"
                  meta:
                    "$ref": "#/components/schemas/HistoryReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '402':
          "$ref": "#/components/responses/ProRequired"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
    parameters:
    - "$ref": "#/components/parameters/FundCik"
  "/funds/{cik}/changes":
    get:
      operationId: listFundChanges
      summary: List changes against the preceding available period
      parameters:
      - "$ref": "#/components/parameters/Period"
      - name: change_type
        in: query
        schema:
          type: string
          enum:
          - new
          - added
          - reduced
          - exited
      - name: sort
        in: query
        description: Missing values last; row ID breaks ties in the same direction.
        schema:
          type: string
          enum:
          - value_change
          - "-value_change"
          - shares_change
          - "-shares_change"
          - cusip
          - "-cusip"
          default: "-value_change"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: No-store quarterly data with plan-aware history metadata. Free has four completed quarters; older selected periods require Pro. Restart cursors after account or plan changes.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/PositionChange"
                  meta:
                    "$ref": "#/components/schemas/HistoryReadPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '402':
          "$ref": "#/components/responses/ProRequired"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
      description: Computed in SQL from effective holdings. Value/share sorts use
        absolute deltas. All contributing current/prior filings are linked; missing
        normalized values remain null. No derived rows are written by this request.
    parameters:
    - "$ref": "#/components/parameters/FundCik"
  "/companies/{ticker}":
    get:
      operationId: getCompany
      summary: Get company identity and 90-day insider summary
      parameters: []
      responses:
        '200':
          description: Locally stored filing data.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/Company"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '404':
          "$ref": "#/components/responses/NotFound"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
      description: Exact case-insensitive ticker. Summary counts first-owner, non-derivative
        P/S rows; suspect or missing prices are excluded from value totals. Existing
        local mappings can supply a name/ticker with null CIK when no Form 4 exists.
    parameters:
    - "$ref": "#/components/parameters/CompanyTicker"
  "/companies/{ticker}/insiders":
    get:
      operationId: listCompanyInsiderTransactions
      summary: List company insider transaction rows
      parameters:
      - "$ref": "#/components/parameters/TransactionType"
      - "$ref": "#/components/parameters/TransactionCode"
      - "$ref": "#/components/parameters/TransactionDirection"
      - "$ref": "#/components/parameters/TransactionRole"
      - "$ref": "#/components/parameters/TransactionInsiderCik"
      - "$ref": "#/components/parameters/TransactionSecurityTable"
      - "$ref": "#/components/parameters/TransactionMinValue"
      - "$ref": "#/components/parameters/TransactionMaxValue"
      - "$ref": "#/components/parameters/TransactionDateFrom"
      - "$ref": "#/components/parameters/TransactionDateTo"
      - "$ref": "#/components/parameters/TransactionSort"
      - "$ref": "#/components/parameters/TransactionLimit"
      - "$ref": "#/components/parameters/TransactionCursor"
      responses:
        '200':
          description: Locally stored filing data.
          content:
