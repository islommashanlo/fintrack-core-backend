          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    maxItems: 100
                    items:
                      "$ref": "#/components/schemas/ActivityEvent"
                  meta:
                    "$ref": "#/components/schemas/ActivityPageMeta"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/activity/{id}":
