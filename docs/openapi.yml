            "$ref": "#/components/schemas/NewsHeadline"
        meta:
          allOf:
          - "$ref": "#/components/schemas/ReadPageMeta"
          - type: object
            required: [status, from, to, entity_resolved, scope, complete, fetched, mention_scope, disclaimer]
            properties:
              status:
                type: string
                enum: [publication_disabled, identity_unresolved, local_cache]
              from:
                type: string
                format: date
              to:
                type: string
                format: date
              entity_resolved:
                type: boolean
                nullable: true
                description: Canonical entity availability; null for a watchlist feed.
              scope:
                type: string
                enum: [issuer, fund, person, watchlist]
              complete:
                type: boolean
                nullable: true
                description: Always null; no complete vendor coverage or freshness is inferred.
              fetched:
                type: boolean
                enum: [false]
              mention_scope:
                type: string
                enum: [matching_feed_entities]
              disclaimer:
                type: string
