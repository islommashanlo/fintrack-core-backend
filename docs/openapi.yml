      - next_cursor
      - limit
      - sort
      - as_of
      properties:
        total_count:
          type: integer
          minimum: 0
          description: All matching rows before the cursor boundary. Counts raw information-table
            rows for holdings.
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
        limit:
          type: integer
          minimum: 1
          maximum: 100
        sort:
          type: string
        as_of:
          type: string
          format: date-time
          description: Original first-page time used for filing visibility and data
            age.
