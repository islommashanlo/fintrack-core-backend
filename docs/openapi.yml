        "$ref": "#/components/schemas/SearchResult"
    SearchResult:
      type: object
      required: [entity_type, entity_key, name, ticker, cik, match_type, profile_path, accession, sec_url, form_type, filed_at, accepted_at, ingested_at, data_age_days]
      properties:
        entity_type:
          type: string
          enum: [issuer, fund, person]
        entity_key:
          type: string
