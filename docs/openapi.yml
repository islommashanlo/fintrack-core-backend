        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '404':
          "$ref": "#/components/responses/NotFound"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
                  minimum: 1
              additionalProperties: false
      description: Soft-remove the owned membership, pause/archive its rule and retain
        delivery history. Re-follow restores the same follow ID without enabling email.
        Shared SEC data remains intact.
