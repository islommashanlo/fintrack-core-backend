        type: string
        pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
    post:
      operationId: explainFiling
      summary: Get or create a cached factual explanation of normalized filing data
      description: Public with browser-session CSRF protection. Send an empty body;
        caller prompts, models and other parameters are rejected. The current
        implementation uses a local template without external AI calls. Counts and
        source fingerprints cover all stored rows; examples are bounded. Earlier
        explanation versions remain stored when source data changes. Responses are
        no-store; the persistent cache is shared across readers. Additional limit
