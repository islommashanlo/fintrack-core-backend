  "/auth/csrf":
    get:
      operationId: getCsrfToken
      summary: Get a browser-session CSRF token
      security: []
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/CsrfToken"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
      description: Fetch with credentials included before every new browser session.
        Response is not cached; matching Rails session cookies must round-trip with
        the token.
  "/auth/signup":
    post:
      operationId: signup
      summary: Create an account and sign in
      security:
      - CsrfToken: []
      parameters: []
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/AccountSession"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '422':
          "$ref": "#/components/responses/AccountValidationFailed"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
                  writeOnly: true
              additionalProperties: false
      description: Normalized email; minimum eight-character password. Rotates browser
        session and CSRF state; replace the client token with the returned token.
        Accounts default to Free; only verified configured billing can grant Pro.
  "/auth/login":
    post:
      operationId: login
      summary: Sign in with email and password
      security:
      - CsrfToken: []
      parameters: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    "$ref": "#/components/schemas/AccountSession"
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  writeOnly: true
              additionalProperties: false
      description: Same INVALID_CREDENTIALS response for an unknown account and wrong
        password. Replaces this browser session and rotates CSRF state. Cookie expires
        after 30 days; server also checks that absolute lifetime.
  "/auth/password/forgot":
    post:
      operationId: requestPasswordRecovery
      summary: Request password reset instructions without disclosing account existence
      description: Known and unknown accounts receive the same response and queue
        an encrypted, expiring request. No token is returned. With FRONTEND_ORIGIN
        configured, mail links to its fixed /reset-password page using a token
        fragment; otherwise the configured mailer host serves the HTML reset page.
        Limits shared with HTML are 10 requests/hour/IP and three requests/15
        minutes/normalized email. Requires browser CSRF and returns no-store.
      security:
      - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '202':
          description: Request accepted; does not confirm account existence or delivery.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - message
                    properties:
                      message:
                        type: string
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/auth/password/reset":
    post:
      operationId: resetPassword
      summary: Consume a reset token, change credentials and revoke sessions
      description: Tokens expire 15 minutes after the request and are bound to
        the current email and password. Concurrent consumption succeeds once.
        Success signs out the submitting browser without creating a new login;
        replace the CSRF token and sign in again. Invalid password validation
        leaves credentials, sessions and token intact. Limit of 10 submissions
        per 15 minutes per IP shared with HTML. Returns no-store.
      security:
      - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - token
              - password
              - password_confirmation
              properties:
                token:
                  type: string
                  maxLength: 2048
                  writeOnly: true
                password:
                  type: string
                  format: password
                  minLength: 8
                  writeOnly: true
                  description: Must not exceed BCrypt's 72-byte limit.
                password_confirmation:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        '200':
          description: Password changed and sessions revoked; a fresh CSRF token is returned.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - message
                    - csrf_token
                    properties:
                      message:
                        type: string
                      csrf_token:
                        type: string
        '400':
          description: INVALID_PARAMETER for malformed input; INVALID_RESET_TOKEN
            for tampered, expired, consumed or deleted-account tokens.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AccountError"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
        '422':
          "$ref": "#/components/responses/AccountValidationFailed"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
  "/auth/logout":
    delete:
      operationId: logout
      summary: Revoke this browser session
      security:
      - CookieSession: []
        CsrfToken: []
      parameters: []
      responses:
        '204':
          description: Completed without a response body.
        '400':
          "$ref": "#/components/responses/InvalidParameter"
        '429':
          "$ref": "#/components/responses/RateLimited"
        '503':
          "$ref": "#/components/responses/LimiterUnavailable"
        '401':
          "$ref": "#/components/responses/AccountUnauthorized"
        '403':
          "$ref": "#/components/responses/InvalidCsrfToken"
  "/me":
    get:
      operationId: getCurrentAccount
      summary: Get the authenticated account
      security:
