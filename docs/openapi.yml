      type: object
      required:
      - total_count
      - has_more
      - next_cursor
      - limit
      - sort
      - as_of
      properties:
        total_count:
          type: integer
          minimum: 0
          description: All matching rows before the cursor boundary. Counts raw information-table
            rows for holdings.
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
        limit:
          type: integer
          minimum: 1
          maximum: 100
        sort:
          type: string
        as_of:
          type: string
          format: date-time
          description: Original first-page time used for filing visibility and data
            age.
    NotFoundError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              enum:
              - NOT_FOUND
            message:
              type: string
    InsiderSummary:
      type: object
      required:
      - window_days
      - purchase_count
      - sale_count
      - issuer_count
      - transactions_without_usable_price
      - counts_by_code
      - purchase_value
      - sale_value
      - net_open_market_value
      properties:
        window_days:
          type: integer
          enum:
          - 30
          - 90
          - 365
        purchase_count:
          type: integer
          minimum: 0
        sale_count:
          type: integer
          minimum: 0
        issuer_count:
          type: integer
          minimum: 0
        transactions_without_usable_price:
          type: integer
          minimum: 0
        counts_by_code:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        purchase_value:
          "$ref": "#/components/schemas/NullableDecimal"
        sale_value:
          "$ref": "#/components/schemas/NullableDecimal"
        net_open_market_value:
          "$ref": "#/components/schemas/NullableDecimal"
    InsiderProfile:
      type: object
      required:
      - cik
      - name
      - latest_filing
      - summaries
      properties:
        cik:
          "$ref": "#/components/schemas/Cik"
        name:
          type: string
          nullable: true
        latest_filing:
          "$ref": "#/components/schemas/FilingProvenance"
        summaries:
          type: array
          minItems: 3
          maxItems: 3
          items:
            "$ref": "#/components/schemas/InsiderSummary"
    InsiderCompany:
      allOf:
      - "$ref": "#/components/schemas/FilingProvenance"
      - type: object
        required:
        - cik
        - name
        - ticker
        - role
        properties:
          cik:
            "$ref": "#/components/schemas/Cik"
          name:
            type: string
            nullable: true
          ticker:
            type: string
            nullable: true
          role:
            type: object
            required:
            - is_director
            - is_officer
            - is_ten_percent_owner
            - is_other
            - officer_title
            properties:
              is_director:
                type: boolean
                nullable: true
              is_officer:
                type: boolean
                nullable: true
              is_ten_percent_owner:
                type: boolean
                nullable: true
              is_other:
                type: boolean
                nullable: true
              officer_title:
                type: string
                nullable: true
    PlanLimits:
      type: object
      required:
      - watchlist_items
      - alert_rules
      - unusual_activity_results
      - screener_results
      - fund_compare
      - history_quarters
      - instant_alerts
      - saved_screens
      - csv_export
      properties:
        watchlist_items:
          type: integer
          minimum: 0
          nullable: true
        alert_rules:
          type: integer
          minimum: 0
          nullable: true
        unusual_activity_results:
          type: integer
          minimum: 0
          nullable: true
        screener_results:
          type: integer
          minimum: 0
          nullable: true
        fund_compare:
          type: integer
          minimum: 0
          nullable: true
        history_quarters:
          type: integer
          minimum: 0
          nullable: true
        instant_alerts:
          type: boolean
        saved_screens:
          type: boolean
        csv_export:
          type: boolean
    Plan:
      type: object
      required:
      - id
      - limits
      properties:
        id:
          type: string
          enum:
          - free
          - pro
        limits:
          "$ref": "#/components/schemas/PlanLimits"
    Account:
      type: object
      required:
      - id
      - email
      - created_at
      - plan
      - limits
      properties:
        id:
          type: integer
          minimum: 0
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        plan:
          type: string
          enum:
          - free
          - pro
        limits:
          "$ref": "#/components/schemas/PlanLimits"
    CsrfToken:
      type: object
      required:
      - csrf_token
      properties:
        csrf_token:
          type: string
    AccountSession:
      type: object
      required:
      - user
      - csrf_token
      properties:
        user:
          "$ref": "#/components/schemas/Account"
        csrf_token:
          type: string
    WatchlistItem:
      type: object
      required:
      - id
      - entity_type
      - entity_key
      - name
      - created_at
      properties:
        id:
          type: integer
          minimum: 0
        entity_type:
          type: string
          enum:
          - issuer
          - fund
          - person
        entity_key:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    AccountError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    ProRequired:
      type: object
      required:
      - code
      - feature
      - limit
      properties:
        code:
          type: string
          enum:
          - PRO_REQUIRED
        feature:
          type: string
          enum:
          - watchlist_items
        limit:
          type: integer
          enum:
          - 15
    FilingHolding:
      type: object
      required:
      - row_sequence
      - cusip
      - figi
      - issuer_name
      - title_of_class
      - value_reported
      - value_unit
      - value_usd
      - shares
      - share_type
      - put_call
      - investment_discretion
      - other_manager
      - voting_authority
      - suspect
      - sec_url
      properties:
        row_sequence:
          type: integer
        cusip:
          type: string
          nullable: true
        figi:
          type: string
          nullable: true
        issuer_name:
          type: string
        title_of_class:
          type: string
        value_reported:
          type: string
        value_unit:
          type: string
        value_usd:
          "$ref": "#/components/schemas/NullableDecimal"
        shares:
          type: string
        share_type:
          type: string
        put_call:
          type: string
          nullable: true
        investment_discretion:
          type: string
          nullable: true
        other_manager:
          type: string
          nullable: true
        voting_authority:
          type: object
          required:
          - sole
          - shared
          - none
          properties:
            sole:
              "$ref": "#/components/schemas/NullableDecimal"
            shared:
              "$ref": "#/components/schemas/NullableDecimal"
            none:
              "$ref": "#/components/schemas/NullableDecimal"
        suspect:
          type: boolean
        sec_url:
          type: string
          format: uri
    FilingDetail:
      type: object
      required:
      - accession
      - form_type
      - sec_url
      - filed_at
      - accepted_at
      - ingested_at
      - data_age_days
      - filer_cik
      - period_of_report
      - parse_status
      - issuer
      - amendment
      - transactions
      - holdings
      properties:
        accession:
          type: string
          pattern: "^[0-9]{10}-[0-9]{2}-[0-9]{6}$"
        form_type:
          type: string
        sec_url:
          type: string
          format: uri
        filed_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        accepted_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        ingested_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        data_age_days:
          type: integer
          nullable: true
        filer_cik:
          "$ref": "#/components/schemas/Cik"
        period_of_report:
          type: string
          format: date
          nullable: true
        parse_status:
          type: string
          enum:
          - pending
          - parsed
          - failed
        issuer:
          type: object
          required:
          - cik
          - name
          - ticker
          properties:
            cik:
              type: string
              nullable: true
            name:
              type: string
              nullable: true
            ticker:
              type: string
              nullable: true
        amendment:
          type: object
          required:
          - is_amendment
          - amends_accession
          - superseded_by
          properties:
            is_amendment:
              type: boolean
            amends_accession:
              type: string
              nullable: true
            superseded_by:
              type: string
              nullable: true
        transactions:
          type: array
          items:
            "$ref": "#/components/schemas/InsiderTransaction"
        holdings:
          type: array
          items:
            "$ref": "#/components/schemas/FilingHolding"
  parameters:
    TransactionType:
      name: type
      in: query
      schema:
        type: string
        enum:
        - all
        - open_market
        - administrative
        default: all
    TransactionCode:
      name: code
      in: query
      description: One SEC code or comma-separated codes; case-insensitive.
      schema:
        type: string
        pattern: "^[A-Za-z](,[A-Za-z])*$"
      example: P,S
    TransactionDirection:
      name: direction
      in: query
      schema:
        type: string
        enum:
        - purchase
        - sale
        - other
    TransactionRole:
      name: role
      in: query
      schema:
        type: string
        enum:
        - director
        - officer
        - ten_percent_owner
        - other
    TransactionInsiderCik:
      name: insider_cik
      in: query
      schema:
        "$ref": "#/components/schemas/Cik"
    TransactionIssuerCik:
      name: issuer_cik
      in: query
      schema:
        "$ref": "#/components/schemas/Cik"
    TransactionTicker:
      name: ticker
      in: query
      description: Exact case-insensitive ticker, including share-class punctuation.
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,19}$"
    TransactionSecurityTable:
      name: security_table
      in: query
      schema:
        type: string
        enum:
        - non_derivative
        - derivative
    TransactionMinValue:
      name: min_value
      in: query
      description: Inclusive minimum reported transaction value in dollars.
      schema:
        "$ref": "#/components/schemas/ValueFilter"
    TransactionMaxValue:
      name: max_value
      in: query
      description: Inclusive maximum reported transaction value in dollars.
      schema:
        "$ref": "#/components/schemas/ValueFilter"
    TransactionDateFrom:
      name: date_from
      in: query
      description: Inclusive transaction date, not filing date.
      schema:
        type: string
        format: date
    TransactionDateTo:
      name: date_to
      in: query
      description: Inclusive transaction date, not filing date.
      schema:
        type: string
        format: date
    TransactionSort:
      name: sort
      in: query
      schema:
        "$ref": "#/components/schemas/TransactionSort"
    TransactionLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    TransactionCursor:
      name: cursor
      in: query
      description: Signed next_cursor from a preceding page; expires in 24 hours.
        Repeat the same normalized filters and sort. Limit may change. Later inserts
        are excluded; updates to existing rows remain visible.
      schema:
        type: string
        maxLength: 8192
    FundCik:
      name: cik
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Cik"
    CompanyTicker:
      name: ticker
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,19}$"
    Period:
      name: period
      in: query
      description: Quarter-end date in YYYY-MM-DD form. Defaults to the latest known
        period where applicable.
      schema:
        type: string
        format: date
    Cusip:
      name: cusip
      in: query
      schema:
        type: string
        pattern: "^[0-9A-Z]{9}$"
    PutCall:
      name: put_call
      in: query
      schema:
        type: string
        enum:
        - PUT
        - CALL
    ShareType:
      name: share_type
      in: query
      schema:
        type: string
        enum:
        - SH
        - PRN
    InsiderCik:
      name: cik
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Cik"
  responses:
    InvalidParameter:
      description: Unknown or malformed parameter, invalid range, invalid or expired
        cursor.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ParameterError"
    NotFound:
      description: Unknown entity in locally stored data.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/NotFoundError"
    AccountUnauthorized:
      description: Missing/expired/revoked session, invalid login credentials, or
        incorrect current password.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
    InvalidCsrfToken:
      description: Missing/invalid CSRF token or an untrusted/null request origin.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
    AccountValidationFailed:
      description: Invalid account attributes or duplicate normalized email.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
    RateLimited:
      description: Shared per-IP, per-user or credential-attempt limit reached.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
      headers:
        Retry-After:
          description: Seconds before retrying.
          schema:
            type: string
    LimiterUnavailable:
      description: Request limiting is temporarily unavailable.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
      headers:
        Retry-After:
          description: Seconds before retrying.
          schema:
            type: string
    ProRequired:
      description: Free watchlist limit reached.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ProRequired"
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      name: session_id
      description: Signed HttpOnly session cookie. Browser fetches must include credentials.
        No bearer tokens are issued.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Get from /auth/csrf with cookies enabled, including before signup/login;
        replace after login or account changes.
