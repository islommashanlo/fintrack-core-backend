      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/SavedScreen"
    ScreenerCondition:
      type: object
      required:
      - field
      - operator
      properties:
        field:
          type: string
          enum:
          - name
          - cik
          - last_filed_on
          - purchase_count
          - sale_count
          - open_market_count
          - purchase_value
          - sale_value
          - net_open_market_value
          - transactions_without_usable_value
          - ticker
          - insider_count
          - issuer_count
          - latest_is_director
          - latest_is_officer
          - latest_is_ten_percent_owner
          - latest_is_other
          - period_of_report
          - holding_row_count
          - position_count
          - portfolio_value_usd
          - suspect
        operator:
          type: string
          enum:
          - eq
          - not_eq
          - contains
          - starts_with
          - in
          - is_null
          - not_null
          - gt
          - gte
          - lt
          - lte
          - between
        value:
          oneOf:
          - type: string
            maxLength: 200
            nullable: true
          - type: number
          - type: boolean
          - type: array
            minItems: 1
            maxItems: 20
            items:
              oneOf:
              - type: string
                maxLength: 200
              - type: number
              - type: boolean
          description: Type follows the selected field. between requires two ascending
            bounds. Null operators omit value or use null. Monetary decimal strings
            preserve precision. Counts must fit a nonnegative signed 64-bit integer;
            dates use the Gregorian calendar with years 0001 through 9999.
      additionalProperties: false
