    TransactionAlertConditions:
      type: object
      additionalProperties: false
      description: Optional AND conditions for insider_transaction rules; new_filing
        requires an empty object. Amounts require a known, non-suspect reported
        price. Output canonicalizes codes and decimal strings. Changing conditions
        requires a paused rule and invalidates older queued configuration versions.
      properties:
        direction:
          type: string
          enum: [purchase, sale, other]
        codes:
          type: array
          minItems: 1
          maxItems: 26
          items:
            type: string
            pattern: "^[A-Za-z]$"
          description: Canonicalized uppercase, unique and sorted.
        role:
          type: string
          enum: [director, officer, ten_percent_owner, other]
        type:
          type: string
          enum: [open_market, administrative]
        security_table:
          type: string
          enum: [non_derivative, derivative]
        min_value:
          description: Inclusive nonnegative dollars; up to 30 integer/12 fractional
            digits. JSON floats and exponent notation rejected. Output is an exact decimal string.
          oneOf:
          - type: string
            pattern: "^[0-9]{1,30}(\\.[0-9]{1,12})?$"
          - type: integer
            minimum: 0
            maximum: 999999999999999999999999999999
    ClusterAlertConditions:
      type: object
      additionalProperties: false
      description: Optional AND conditions for cluster rules. The acceptance-time
        window remains fixed at the captured methodology definition, currently
        14 days and three first-listed non-derivative P/S owners. A minimum value
        requires a complete usable total. Rule edits require pause and invalidate
        queued older configuration versions. Only issuer/person follows supported.
      properties:
        direction:
          type: string
          enum: [purchase, sale]
        min_insiders:
          type: integer
          minimum: 3
          maximum: 1000
        min_value:
          description: Inclusive complete dollar total; normalized exact decimal
            string. Same input bounds as transaction amounts; floats rejected.
          oneOf:
          - type: string
            pattern: "^[0-9]{1,30}(\\.[0-9]{1,12})?$"
          - type: integer
            minimum: 0
            maximum: 999999999999999999999999999999
    InstitutionalAlertConditions:
      type: object
      additionalProperties: false
      description: Optional AND filters for fund-only 13f_change rules. Requires
        complete adjacent report quarters; amount means absolute normalized value
        change and needs complete normalization. No issuer lookup or enrichment.
      properties:
        change_types:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            enum: [new, added, reduced, exited]
        direction:
          type: string
          enum: [increase, decrease]
        cusip:
          type: string
          pattern: "^[0-9A-Z]{9}$"
        put_call:
          type: string
          enum: [PUT, CALL]
        share_type:
          type: string
          enum: [SH, PRN]
        min_value:
          description: Inclusive absolute normalized dollar-value change. Floats,
            exponent notation and unknown amounts are rejected or cannot match.
          oneOf:
          - type: string
            pattern: "^[0-9]{1,30}(\\.[0-9]{1,12})?$"
          - type: integer
            minimum: 0
            maximum: 999999999999999999999999999999
    InstitutionalAlertPosition:
      allOf:
      - "$ref": "#/components/schemas/PositionChange"
      - type: object
        required: [id, observed_at, fund, direction, values_complete, evidence_sources]
        properties:
          id:
            type: string
            pattern: "^institutional_change_[0-9a-f]{64}$"
          observed_at:
            type: string
            format: date-time
          fund:
            type: object
            required: [cik, name]
            properties:
              cik:
                "$ref": "#/components/schemas/Cik"
              name:
                type: string
          direction:
            type: string
            enum: [increase, decrease]
          values_complete:
            type: boolean
            description: Both full report contexts have valid normalized values; otherwise dollar fields are null.
          evidence_sources:
            type: array
            items:
              "$ref": "#/components/schemas/FilingProvenance"
      description: Immutable adjacent-quarter fund comparison with full current,
        prior and original-amendment evidence. Parent provenance can be a baseline
        amendment; period_of_report identifies the comparison quarter. Source sets
        must remain exactly effective to send pending alerts. Shared state survives
        private account deletion; reported SEC values remain unchanged.
    NewsAlertConditions:
      type: object
      additionalProperties: false
      description: Optional AND filters on approved local news. Arrays normalize to sorted unique values. Provider filters never grant publication rights.
      properties:
        kinds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            enum: [news, press_release, other]
        providers:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            pattern: '^[a-z][a-z0-9_]{0,39}$'
        source:
          type: string
          minLength: 1
          maxLength: 200
          description: Exact publisher label; blank text, markup and control characters are rejected.
    NewsAlertSnapshot:
      type: object
      nullable: true
      required: [id, news_item_id, provider, provider_item_id, source, title, url, kind, published_at, item_observed_at, mention_observed_at, observed_at, entity]
      properties:
        id:
          type: integer
        news_item_id:
          type: integer
        provider:
          type: string
        provider_item_id:
          type: string
        source:
          type: string
        title:
          type: string
          maxLength: 500
        url:
          type: string
          format: uri
        kind:
          type: string
          enum: [news, press_release, other]
        published_at:
          type: string
          format: date-time
        item_observed_at:
          type: string
          format: date-time
        mention_observed_at:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
          description: First capture of this shared immutable source snapshot; delivery created_at is per-rule matching time.
        entity:
          type: object
          required: [entity_type, cik]
          properties:
            entity_type:
              type: string
              enum: [issuer, fund, person]
            cik:
              "$ref": "#/components/schemas/Cik"
    AlertEventProvenance:
      type: object
      required: [accession, sec_url, form_type, filed_at, accepted_at, ingested_at, data_age_days]
      description: SEC provenance is null for news. Filing-derived triggers retain their original nonnull accession, URL and form contract.
      properties:
        accession:
          type: string
          nullable: true
          pattern: '^[0-9]{10}-[0-9]{2}-[0-9]{6}$'
        sec_url:
          type: string
          format: uri
          nullable: true
        form_type:
          type: string
          nullable: true
        filed_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        accepted_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        ingested_at:
          "$ref": "#/components/schemas/NullableTimestamp"
        data_age_days:
          type: integer
          nullable: true
    AlertRuleConditions:
      description: Schema is selected by trigger. Filing rules require an empty
        object; insider_transaction, cluster, 13f_change and news accept only their own listed fields.
      anyOf:
      - "$ref": "#/components/schemas/TransactionAlertConditions"
      - "$ref": "#/components/schemas/ClusterAlertConditions"
      - "$ref": "#/components/schemas/InstitutionalAlertConditions"
      - "$ref": "#/components/schemas/NewsAlertConditions"
    FilingAlertRule:
      type: object
      required:
      - id
      - follow_id
      - trigger
      - entity
      - conditions
      - channels
      - frequency
      - active
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        follow_id:
          type: integer
          format: int64
          minimum: 1
        trigger:
          type: string
          enum:
          - new_filing
          - insider_transaction
          - cluster
          - "13f_change"
          - news
        entity:
          type: object
          required:
          - type
          - key
          properties:
            type:
              type: string
              enum:
              - issuer
              - fund
              - person
            key:
              type: string
        conditions:
          "$ref": "#/components/schemas/AlertRuleConditions"
        channels:
          type: array
          items:
            type: string
            enum:
            - email
          minItems: 1
          maxItems: 1
        frequency:
          type: string
          enum:
          - daily_digest
          - instant
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FilingAlertEvent:
      allOf:
      - "$ref": "#/components/schemas/AlertEventProvenance"
      - type: object
        required:
        - id
        - rule_id
        - trigger
        - entity
        - channel
        - frequency
        - status
        - error_code
        - delivered_at
        - created_at
        - updated_at
        - period_of_report
        - read_at
        - transaction
        - cluster
        - position_change
        - news
        - news_available
        properties:
          id:
            type: integer
            format: int64
            minimum: 1
          rule_id:
            type: integer
            format: int64
            minimum: 1
          trigger:
            type: string
            enum:
            - new_filing
            - insider_transaction
            - cluster
            - "13f_change"
            - news
          news:
            "$ref": "#/components/schemas/NewsAlertSnapshot"
          news_available:
            type: boolean
            nullable: true
            description: Null for other triggers; false if current publication/source checks withhold news content while retaining alert state.
          position_change:
            type: object
            nullable: true
            allOf:
            - "$ref": "#/components/schemas/InstitutionalAlertPosition"
            description: Immutable fund comparison state; null for other triggers.
          cluster:
            type: object
            nullable: true
            allOf:
            - "$ref": "#/components/schemas/InsiderCluster"
            - type: object
              required: [observed_at, definition_minimum_insiders]
              properties:
                observed_at:
                  type: string
                  format: date-time
                definition_minimum_insiders:
                  type: integer
                  minimum: 3
            description: Immutable observed window evidence with full sources; null for other triggers.
          transaction:
            type: object
            nullable: true
            allOf:
            - "$ref": "#/components/schemas/InsiderTransaction"
            description: Matched normalized transaction and owner evidence; null for filing alerts.
          entity:
            type: object
            required:
            - type
            - key
            properties:
              type:
                type: string
                enum:
                - issuer
                - fund
                - person
              key:
                type: string
          channel:
            type: string
            enum:
            - email
          frequency:
            type: string
            enum:
            - daily_digest
            - instant
          status:
            type: string
            enum:
            - pending
            - sent
            - failed
          error_code:
            type: string
            enum:
            - DELIVERY_FAILED
            nullable: true
            description: Provider errors and infrastructure text remain private.
          delivered_at:
            "$ref": "#/components/schemas/NullableTimestamp"
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
          period_of_report:
            type: string
            format: date
            nullable: true
          read_at:
            "$ref": "#/components/schemas/NullableTimestamp"
    FilingAlertCapabilities:
      type: object
      required:
      - capabilities
      - limits
      - supported_triggers
      - supported_channels
      - supported_frequencies
      - transaction_condition_fields
      - cluster_condition_fields
      - institutional_condition_fields
      - news_condition_fields
      properties:
        capabilities:
          type: object
          required:
          - rule_creation
          - rule_deletion
          - pause_rules
          - resume_rules
          - daily_digest
          - condition_filters
          - read_tracking
          - instant_alerts
          properties:
            rule_creation:
              type: boolean
            rule_deletion:
              type: boolean
            pause_rules:
              type: boolean
            resume_rules:
              type: boolean
            daily_digest:
              type: boolean
            condition_filters:
              type: boolean
            read_tracking:
              type: boolean
            instant_alerts:
              type: boolean
        limits:
          type: object
          required:
          - alert_rules
          properties:
            alert_rules:
              type: integer
              minimum: 0
              nullable: true
        supported_triggers:
          type: array
          items:
            type: string
            enum:
            - new_filing
            - insider_transaction
            - cluster
            - "13f_change"
            - news
        news_condition_fields:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [kinds, source, providers]
        institutional_condition_fields:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [change_types, direction, cusip, put_call, share_type, min_value]
        cluster_condition_fields:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [direction, min_insiders, min_value]
        transaction_condition_fields:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [direction, codes, role, type, security_table, min_value]
        supported_channels:
          type: array
          items:
            type: string
            enum:
            - email
        supported_frequencies:
          type: array
          items:
            type: string
            enum:
            - daily_digest
            - instant
    FilingAlertPageMeta:
      allOf:
      - "$ref": "#/components/schemas/ReadPageMeta"
      - "$ref": "#/components/schemas/FilingAlertCapabilities"
    FilingAlertRuleUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        active:
          type: boolean
        frequency:
          type: string
          enum:
          - daily_digest
          - instant
        trigger:
          type: string
          enum:
          - new_filing
          - insider_transaction
          - cluster
          - "13f_change"
          - news
        channels:
          type: array
          items:
            type: string
            enum:
            - email
          minItems: 1
          maxItems: 1
        conditions:
          "$ref": "#/components/schemas/AlertRuleConditions"
    FilingAlertRuleCreate:
      type: object
      required:
      - follow_id
      properties:
        active:
          type: boolean
        frequency:
          type: string
          enum:
          - daily_digest
          - instant
        trigger:
          type: string
          enum:
          - new_filing
          - insider_transaction
          - cluster
          - "13f_change"
          - news
        channels:
          type: array
          items:
            type: string
            enum:
            - email
          minItems: 1
          maxItems: 1
        conditions:
          "$ref": "#/components/schemas/AlertRuleConditions"
        follow_id:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false
    NotificationPreferences:
      type: object
      required:
      - time_zone
      - email_enabled
      - digest_local_time
      - configured
      - push_enabled
      - push
      properties:
        time_zone:
          type: string
          nullable: true
        email_enabled:
          type: boolean
        push_enabled:
          type: boolean
        push:
          "$ref": "#/components/schemas/PushChannelEligibility"
        digest_local_time:
          type: string
          enum:
          - '07:00'
        configured:
          type: boolean
  parameters:
    ExportLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1000
    ExportCursor:
      name: cursor
      in: query
      description: X-Export-Next-Cursor from the prior file. Repeat dataset, filters
        and sort; limit may change. Bound to account/export context, expires in
        24 hours. Verified Pro is rechecked. Incompatible with JSON list cursors.
      schema:
        type: string
        maxLength: 8192
    ExportFundCik:
      name: cik
      in: query
      required: true
      schema:
        "$ref": "#/components/schemas/Cik"
    TransactionType:
      name: type
      in: query
      schema:
        type: string
        enum:
        - all
        - open_market
        - administrative
        default: all
    TransactionCode:
      name: code
      in: query
      description: One SEC code or comma-separated codes; case-insensitive.
      schema:
        type: string
        pattern: "^[A-Za-z](,[A-Za-z])*$"
      example: P,S
    TransactionDirection:
      name: direction
      in: query
      schema:
        type: string
        enum:
        - purchase
        - sale
        - other
    TransactionRole:
      name: role
      in: query
      schema:
        type: string
        enum:
        - director
        - officer
        - ten_percent_owner
        - other
    TransactionInsiderCik:
      name: insider_cik
      in: query
      schema:
        "$ref": "#/components/schemas/Cik"
    TransactionIssuerCik:
      name: issuer_cik
      in: query
      schema:
        "$ref": "#/components/schemas/Cik"
    TransactionTicker:
      name: ticker
      in: query
      description: Exact case-insensitive ticker, including share-class punctuation.
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,19}$"
    TransactionSecurityTable:
      name: security_table
      in: query
      schema:
        type: string
        enum:
        - non_derivative
        - derivative
    TransactionMinValue:
      name: min_value
      in: query
      description: Inclusive minimum reported transaction value in dollars.
      schema:
        "$ref": "#/components/schemas/ValueFilter"
    TransactionMaxValue:
      name: max_value
      in: query
      description: Inclusive maximum reported transaction value in dollars.
      schema:
        "$ref": "#/components/schemas/ValueFilter"
    TransactionDateFrom:
      name: date_from
      in: query
      description: Inclusive transaction date, not filing date.
      schema:
        type: string
        format: date
    TransactionDateTo:
      name: date_to
      in: query
      description: Inclusive transaction date, not filing date.
      schema:
        type: string
        format: date
    TransactionSort:
      name: sort
      in: query
      schema:
        "$ref": "#/components/schemas/TransactionSort"
    TransactionLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    TransactionCursor:
      name: cursor
      in: query
      description: Signed next_cursor from a preceding page; expires in 24 hours.
        Repeat the same normalized filters and sort. Limit may change. Later inserts
        are excluded; updates to existing rows remain visible.
      schema:
        type: string
        maxLength: 8192
    NewsFrom:
      name: from
      in: query
      description: Inclusive UTC publication date. Defaults to 29 days before to. Maximum 366 inclusive days.
      schema:
        type: string
        format: date
    NewsTo:
      name: to
      in: query
      description: Inclusive UTC publication date, no later than the snapshot date. Defaults to the snapshot date.
      schema:
        type: string
        format: date
    NewsKind:
      name: kind
      in: query
      schema:
        type: string
        enum: [news, press_release, other]
    NewsSource:
      name: source
      in: query
      description: Exact publisher label; control characters are rejected.
      schema:
        type: string
        maxLength: 200
    NewsProvider:
      name: provider
      in: query
      description: Exact provider key. This never overrides the publication allowlist.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]{0,39}$'
    NewsSort:
      name: sort
      in: query
      schema:
        type: string
        enum: [published_at, '-published_at', observed_at, '-observed_at']
        default: '-published_at'
    FundCik:
      name: cik
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Cik"
    CompanyTicker:
      name: ticker
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,19}$"
    Period:
      name: period
      in: query
      description: Quarter-end date in YYYY-MM-DD form. Defaults to the latest known
        period where applicable.
      schema:
        type: string
        format: date
    Cusip:
      name: cusip
      in: query
      schema:
        type: string
        pattern: "^[0-9A-Z]{9}$"
    PutCall:
      name: put_call
      in: query
      schema:
        type: string
        enum:
        - PUT
        - CALL
    ShareType:
      name: share_type
      in: query
      schema:
        type: string
        enum:
        - SH
        - PRN
    InsiderCik:
      name: cik
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Cik"
  responses:
    NewsFeed:
      description: Stored headline/link metadata and matching canonical mention previews; no external request or complete-coverage claim.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/NewsFeedResponse"
    CsvExport:
      description: UTF-8 quoted CSV attachment, CRLF records, at most 1000 rows and
        10 MiB. Empty results retain the header. Decimals are exact strings and
        unknown values blank; nested scalar headers use dot notation and source
        arrays are JSON cells. Every row includes filing provenance and disclaimer.
        Text formula prefixes receive a literal apostrophe; typed negative numbers
        remain unchanged. See docs/api-v1.md for dataset columns and continuation.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Content-Disposition:
          description: Attachment with a server-generated dataset/snapshot filename.
          schema:
            type: string
        X-Export-Row-Count:
          description: Data rows in this file, excluding header.
          schema:
            type: integer
            minimum: 0
            maximum: 1000
        X-Export-Total-Count:
          description: Matching snapshot rows before the cursor boundary.
          schema:
            type: integer
            minimum: 0
        X-Export-Has-More:
          schema:
            type: boolean
        X-Export-Next-Cursor:
          description: Signed continuation; omitted on the last page. Repeat filters and sort.
          schema:
            type: string
            maxLength: 8192
        X-Export-As-Of:
          schema:
            type: string
            format: date-time
        X-Export-Sort:
          schema:
            type: string
        X-Export-Row-Limit:
          schema:
            type: integer
            enum: [1000]
      content:
        text/csv:
          schema:
            type: string
            format: binary
    ExportTooLarge:
      description: JSON EXPORT_TOO_LARGE error; no partial CSV. Narrow filters or
        reduce limit to keep the file under 10 MiB.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
    InvalidParameter:
      description: Unknown or malformed parameter, invalid range, invalid or expired
        cursor.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ParameterError"
    NotFound:
      description: Unknown entity in locally stored data.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/NotFoundError"
    AccountUnauthorized:
      description: Missing/expired/revoked session, invalid login credentials, or
        incorrect current password.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
    InvalidCsrfToken:
      description: Missing/invalid CSRF token or an untrusted/null request origin.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
    AccountValidationFailed:
      description: Invalid account, notification preference or alert configuration.
        Activation without required preferences returns ALERT_CONFIGURATION_REQUIRED.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
    RateLimited:
      description: Shared per-IP, per-user or credential-attempt limit reached.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
      headers:
        Retry-After:
          description: Seconds before retrying.
          schema:
            type: string
    LimiterUnavailable:
      description: Request limiting is temporarily unavailable.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
      headers:
        Retry-After:
          description: Seconds before retrying.
          schema:
            type: string
    BillingConflict:
      description: CHECKOUT_CONFLICT for interval/price changes; CHECKOUT_EXPIRED
        requires a new UUID after verified expiry; CHECKOUT_PENDING_CONFIRMATION
        for completed/unresolved work; CHECKOUT_REVIEW_REQUIRED for uncertain or
        invalid provider outcomes; BILLING_ALREADY_EXISTS for a nonterminal
        subscription; BILLING_CUSTOMER_REQUIRED when portal has no owned customer.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
    BillingProviderError:
      description: Malformed or rejected provider response; no provider details exposed.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
    BillingUnavailable:
      description: Billing disabled/missing configuration, transient provider failure
        or limiter unavailable. Checkout intents survive failures; retry the same UUID.
      headers:
        Retry-After:
          schema:
            type: string
          description: Seconds before retrying (60 for billing configuration/transport).
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
    ProRequired:
      description: A server-side entitlement or feature limit prevents this action.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ProRequired"
  securitySchemes:
    StripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Stripe-generated t/v1 signatures authenticate the unmodified
        raw body. Timestamp tolerance is five minutes; browser CSRF is not used.
    CookieSession:
      type: apiKey
      in: cookie
      name: session_id
      description: Signed HttpOnly session cookie. Browser fetches must include credentials.
        No bearer tokens are issued.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Get from /auth/csrf with cookies enabled, including before signup/login;
        replace after login or account changes.
