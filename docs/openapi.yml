            - insiders
          cik:
            "$ref": "#/components/schemas/Cik"
          name:
            type: string
          ticker:
            type: string
            nullable: true
          last_filed_at:
            type: string
            format: date-time
          last_filed_on:
            type: string
            format: date
          period_of_report:
            type: string
            format: date
            nullable: true
          window_days:
            type: integer
            enum:
            - 30
            - 90
            - 365
            nullable: true
          metrics:
            oneOf:
            - "$ref": "#/components/schemas/ScreenerCompaniesMetrics"
            - "$ref": "#/components/schemas/ScreenerFundsMetrics"
            - "$ref": "#/components/schemas/ScreenerInsidersMetrics"
          source_filing_count:
            type: integer
            minimum: 0
          latest_role:
            type: object
            required:
            - latest_role_issuer_cik
            - officer_title
            properties:
              latest_role_issuer_cik:
                "$ref": "#/components/schemas/Cik"
              officer_title:
                type: string
                nullable: true
            nullable: true
    ScreenerPageMeta:
      allOf:
      - "$ref": "#/components/schemas/ReadPageMeta"
      - type: object
        required:
        - entity
        - window_days
        - truncated
        - feature
        - preview_limit
        - scoring_available
        - sector_available
        properties:
          entity:
            type: string
            enum:
            - companies
            - funds
            - insiders
          window_days:
            type: integer
            nullable: true
          truncated:
            type: boolean
          feature:
            type: string
            enum:
            - screener_results
          preview_limit:
            type: integer
            minimum: 0
            nullable: true
          scoring_available:
            type: boolean
            enum:
            - false
          sector_available:
            type: boolean
            enum:
            - false
      description: 'total_count counts every match. Pagination operates within the
        server-entitled prefix: at most three Free results per screen across pages.
        truncated may remain true when has_more is false.'
  parameters:
    TransactionType:
      name: type
      in: query
      schema:
        type: string
        enum:
        - all
        - open_market
        - administrative
        default: all
    TransactionCode:
      name: code
      in: query
      description: One SEC code or comma-separated codes; case-insensitive.
      schema:
        type: string
        pattern: "^[A-Za-z](,[A-Za-z])*$"
      example: P,S
    TransactionDirection:
      name: direction
      in: query
      schema:
        type: string
        enum:
        - purchase
        - sale
        - other
    TransactionRole:
      name: role
      in: query
      schema:
        type: string
        enum:
        - director
        - officer
        - ten_percent_owner
        - other
    TransactionInsiderCik:
      name: insider_cik
      in: query
      schema:
        "$ref": "#/components/schemas/Cik"
    TransactionIssuerCik:
      name: issuer_cik
      in: query
      schema:
        "$ref": "#/components/schemas/Cik"
    TransactionTicker:
      name: ticker
      in: query
      description: Exact case-insensitive ticker, including share-class punctuation.
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,19}$"
    TransactionSecurityTable:
      name: security_table
      in: query
      schema:
        type: string
        enum:
        - non_derivative
        - derivative
    TransactionMinValue:
      name: min_value
      in: query
      description: Inclusive minimum reported transaction value in dollars.
      schema:
        "$ref": "#/components/schemas/ValueFilter"
    TransactionMaxValue:
      name: max_value
      in: query
      description: Inclusive maximum reported transaction value in dollars.
      schema:
        "$ref": "#/components/schemas/ValueFilter"
    TransactionDateFrom:
      name: date_from
      in: query
      description: Inclusive transaction date, not filing date.
      schema:
        type: string
        format: date
    TransactionDateTo:
      name: date_to
      in: query
      description: Inclusive transaction date, not filing date.
      schema:
        type: string
        format: date
    TransactionSort:
      name: sort
      in: query
      schema:
        "$ref": "#/components/schemas/TransactionSort"
    TransactionLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    TransactionCursor:
      name: cursor
      in: query
      description: Signed next_cursor from a preceding page; expires in 24 hours.
        Repeat the same normalized filters and sort. Limit may change. Later inserts
        are excluded; updates to existing rows remain visible.
      schema:
        type: string
        maxLength: 8192
    FundCik:
      name: cik
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Cik"
    CompanyTicker:
      name: ticker
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9.-]{0,19}$"
    Period:
      name: period
      in: query
      description: Quarter-end date in YYYY-MM-DD form. Defaults to the latest known
        period where applicable.
      schema:
        type: string
        format: date
    Cusip:
      name: cusip
      in: query
      schema:
        type: string
        pattern: "^[0-9A-Z]{9}$"
    PutCall:
      name: put_call
      in: query
      schema:
        type: string
        enum:
        - PUT
        - CALL
    ShareType:
      name: share_type
      in: query
      schema:
        type: string
        enum:
        - SH
        - PRN
    InsiderCik:
      name: cik
      in: path
      required: true
      schema:
        "$ref": "#/components/schemas/Cik"
  responses:
    InvalidParameter:
      description: Unknown or malformed parameter, invalid range, invalid or expired
        cursor.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ParameterError"
    NotFound:
      description: Unknown entity in locally stored data.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/NotFoundError"
    AccountUnauthorized:
      description: Missing/expired/revoked session, invalid login credentials, or
        incorrect current password.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
    InvalidCsrfToken:
      description: Missing/invalid CSRF token or an untrusted/null request origin.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
    AccountValidationFailed:
      description: Invalid account attributes or duplicate normalized email.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
    RateLimited:
      description: Shared per-IP, per-user or credential-attempt limit reached.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
      headers:
        Retry-After:
          description: Seconds before retrying.
          schema:
            type: string
    LimiterUnavailable:
      description: Request limiting is temporarily unavailable.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AccountError"
      headers:
        Retry-After:
          description: Seconds before retrying.
          schema:
            type: string
    ProRequired:
      description: Free watchlist limit reached.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ProRequired"
  securitySchemes:
    CookieSession:
      type: apiKey
      in: cookie
      name: session_id
      description: Signed HttpOnly session cookie. Browser fetches must include credentials.
        No bearer tokens are issued.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Get from /auth/csrf with cookies enabled, including before signup/login;
        replace after login or account changes.
