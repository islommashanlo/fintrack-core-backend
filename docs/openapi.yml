        insider_transactions:
          type: integer
          minimum: 0
          description: Effective transactions from window filings; joint-owner copies count once.
        institutional_reports:
          type: integer
          minimum: 0
          description: Visible parsed report records in the window, including notices and amendments.
        watchlist_items:
          type: integer
          minimum: 0
        watchlist_activity_events:
          type: integer
          minimum: 0
        cluster_windows:
          type: integer
          minimum: 0
          description: Qualifying rolling windows, not distinct issuers.
    DashboardSectionFilters:
      type: object
