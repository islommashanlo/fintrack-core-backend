# SEC jobs are opt-in; application digests remain scheduled independently.
shared:
  in_app_notifications:
    cron: "* * * * *"
    class: PublishInAppNotificationsJob
    description: Publish due in-app notifications without email delivery
  alert_digests:
    cron: "* * * * *"
    class: ScheduleAlertDigestsJob
    description: Schedule due filing email digests at 07:00 user-local time
  poll_edgar:
    cron: "* * * * *"
    class: PollEdgarJob
    description: Look for new Form 4 filings through EDGAR full-text search
  poll_13f:
    cron: "* * * * *"
    class: Poll13fJob
    description: Look for new 13F filings through EDGAR full-text search
  reconcile_edgar:
    # 07:30 UTC is 02:30 or 03:30 US Eastern; the previous day's index is published around 22:00 Eastern.
    cron: "30 7 * * *"
    class: ReconcileEdgarJob
    description: Register anything in yesterday's daily index that the poller missed
