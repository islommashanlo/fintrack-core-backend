version: "1.5-draft"
purpose: "Describe the relative significance and unusualness of reported filing activity."
disclaimer: "Data from public SEC filings. Not investment advice."
clusters:
  status: available
  window_days: 14
  minimum_insiders: 3
  time_basis: filed_at
  window_bounds: "Exclusive start, inclusive end; anchored at a qualifying SEC acceptance timestamp."
  directions: [purchase, sale]
  eligible_table: non_derivative
  joint_owner_policy: "Count each transaction line once with its first-listed reporting owner; joint-owner copies do not add count or value."
  missing_values: "Retain counts and a known-value subtotal; the full total is null if any member lacks a usable value."
score:
  status: unavailable
  market_input_requirements:
    status: blocked
    coverage_evaluated: false
    applicability_status: unresolved
    requirements:
      - id: issuer_market_cap
        storage_status: partial
        scoring_status: unimplemented
        time_policy: "Require a dated issuer value and a source knowledge timestamp no later than event evaluation; never substitute a current value."
        blockers: [source_population, source_rights, validated_measurement_basis, currency_policy, issuer_security_identity]
      - id: daily_dollar_volume
        storage_status: partial
        scoring_status: unimplemented
        time_policy: "Stored session dates and observed_at must both precede evaluation; a session date alone does not establish when a bar was knowable."
        blockers: [session_calendar, session_completion_time, averaging_window, minimum_session_coverage, price_volume_basis, currency_policy, provider_selection]
      - id: issuer_security_identity
        storage_status: partial
        scoring_status: unimplemented
        time_policy: "Require an unambiguous effective-dated identity and knowledge timestamp at evaluation; current ticker/CUSIP cache matches are insufficient."
        blockers: [source_population, source_rights, historical_identity_validation, revision_resolution, conflict_resolution, option_and_principal_applicability]
      - id: comparable_reported_magnitude
        storage_status: partial
        scoring_status: unimplemented
        time_policy: "Use the reported magnitude known at event evaluation with a defined matching currency, unit and instrument basis."
        blockers: [source_specific_formula, currency_policy, option_and_principal_applicability, institutional_valuation_effects]
  minimum: 0
  maximum: 100
  insider_factors:
    status: draft
    detail_diagnostics: available
    eligible_rows: "First-listed, non-derivative P/S transactions from resolved Form 4 filings."
    evaluated_at: "The event's SEC acceptance timestamp; later filings and amendments cannot enter its factors."
    history_days: 365
    minimum_history: 5
    history_formula: "Fraction of usable observed prior same-direction canonical transaction values less than or equal to this value; exclude the current acceptance timestamp."
    history_coverage: "Observed database history only; five values permit a comparison but do not establish complete EDGAR coverage."
    role_values: {officer: 1.0, director: 0.75, ten_percent_owner: 0.5, other: 0.25}
    role_policy: "Use the first checked role in the published order; no checked role contributes zero. Officer titles are not interpreted."
    position_formula: "Infer preceding shares from reported following shares and P/A or S/D direction; use min(changed shares / preceding shares, 1), with zero preceding shares contributing 1."
    position_scope: "The individual reported transaction line, not the person's complete direct and indirect holdings. Inconsistent direction or negative inferred shares are unavailable."
    participation_formula: "Clamp (distinct same-direction first-listed owners within the preceding 14 days minus 1) / (cluster minimum minus 1) to 0–1."
    staleness_full_penalty_days: 30
    staleness_formula: "Clamp elapsed calendar days from transaction date to Eastern acceptance date / 30 to 0–1, multiplied by the maximum penalty. Missing or future transaction dates are unavailable."
    staleness_scope: "Calendar-day data age, not a determination of legal filing lateness or a business-day deadline calculation."
    required_coverage: "Every positive factor and staleness must be available, and scoring must be activated, before an overall score is returned. Missing factors are never zero-filled or reweighted."
    unsupported_sources: "Derivative and administrative insider scoring factors remain unimplemented."
  institutional_factors:
    status: draft
    detail_diagnostics: available
    evaluated_at: "Latest acceptance time among the signed event's current and prior comparison reports."
    source_coverage: "Require both adjacent-quarter report contexts, matching cover row/value totals, valid positive-share rows, no suspect flags, and a visible original for amendments. Empty reports with zero cover totals remain valid."
    value_coverage: "Normalized values must be present, nonnegative and consistent with the stored reported unit and cover unit; missing values cannot supply value-change history."
    history_quarters: 8
    minimum_history: 5
    history_formula: "Across the same fund's preceding eight quarters, compare the absolute reported dollar value change with at least five usable adjacent-quarter changes of the same share-change direction. Exclude the current quarter and comparisons accepted at the evaluation timestamp."
    history_scope: "Observed reported value changes include valuation effects and are not transaction values or capital flows. Missing quarters and incomplete report contexts do not supply history."
    change_type_values: {new: 1.0, exit: 1.0, add: 0.5, trim: 0.5}
    position_formula: "Use min(abs(changed shares) / preceding shares, 1); a new position absent from a complete preceding report contributes 1. Keep CUSIP, put/call and share type separate."
    participation_full_count: 3
    participation_formula: "Clamp (distinct reporting funds with the exact same quarter, CUSIP, put/call, share type and change type minus 1) / 2 to 0–1, using only complete adjacent-quarter contexts known by evaluation time."
    participation_scope: "Counts reporting funds, not independent investment decisions; shared managers may overlap. Missing value normalization does not imply a missing share-change report."
    staleness_full_penalty_days: 90
    staleness_formula: "Clamp calendar days from quarter end to Eastern evaluation date / 90 to 0–1, multiplied by the maximum penalty. Future report periods are unavailable."
    staleness_scope: "Age of the reported quarter when the comparison became available, not a legal deadline determination."
    version_policy: "Pin the subject fund's current/prior reports to the signed event version; later accepted reports and amendments cannot enter any factor. Fresh reads may include newly ingested backdated records."
    required_coverage: "Every positive factor and staleness must be available, and scoring must be activated, before an overall score is returned. Issuer scale/liquidity remains unavailable."
  levels:
    - {id: normal, label: Normal, minimum: 0, maximum: 39}
    - {id: elevated, label: Elevated, minimum: 40, maximum: 64}
    - {id: high, label: High, minimum: 65, maximum: 84}
    - {id: unusual, label: Unusual, minimum: 85, maximum: 100}
  proposal:
    status: draft
    positive_weight_total: 100
    maximum_lateness_penalty: 15
    factors:
      - id: own_history
        proposed_weight: 25
        description: "Reported size compared with the same filer's available prior history."
        data_status: partial
      - id: issuer_scale_and_liquidity
        proposed_weight: 25
        description: "Reported size compared with issuer market capitalization and average daily dollar volume."
        data_status: unavailable
      - id: reported_context
        proposed_weight: 15
        description: "Reported role, transaction type, or institutional position context."
        data_status: partial
      - id: position_size_change
        proposed_weight: 20
        description: "Reported change as a fraction of the available preceding holding."
        data_status: partial
      - id: corroborating_activity
        proposed_weight: 15
        description: "Distinct reported insider participation or other funds reporting the same position change."
        data_status: partial
    lateness:
      description: "Reduce the score when the reported activity is stale at filing time."
      data_status: partial
    aggregation: "Normalize each applicable factor to 0–1, apply its proposed weight, subtract the lateness penalty, then clamp to 0–100."
    missing_data_policy: "Do not substitute zero or rescale missing factors into a full score. Required input coverage and source-specific applicability must be defined before activating scoring."
    history_policy: "Use only filings accepted by the event's evaluation timestamp; unresolved amendments and incomplete baselines cannot supply comparison history."
    reasons_policy: "Generate 2–4 factual template-based reasons from measured factors; do not generate predictions or personalized guidance."
    activation_requirements:
      - "Define source-specific factor formulas, applicability and minimum history coverage."
      - "Implement point-in-time factor queries and missing-input checks."
      - "Test factor bounds, level thresholds, late filings and amendment revisions."
      - "Version and publish the implemented methodology before returning scores."

reported_allocation_turnover:
  status: available
  version: reported-allocation-turnover-v1
  formula: "50 times the sum of absolute differences between current and prior normalized reported position weights (weights expressed as fractions)."
  periods: "Selected report quarter and immediately preceding calendar quarter; never substitute an older available report."
  security_key: [cusip, put_call, share_type]
  coverage: "The selected period cannot be after the observation date. Both effective portfolios must pass the shared cover/row/unit/original-resolution checks and have positive normalized reported totals. Missing or incomplete inputs yield null, not zero."
  amendments: "Use the latest effective base or restatement and subsequent NEW HOLDINGS additions for each quarter independently."
  interpretation: "Change in reported portfolio allocations, including valuation effects and reporting-scope changes. It does not measure executed transactions, capital flows or investment performance."
  zero_policy: "Unchanged reported weights produce zero; complete empty or zero-value portfolios have undefined weights and yield null."
  history_policy: "The selected quarter follows Free/Pro history limits; its adjacent baseline remains source context even when just outside that window."
